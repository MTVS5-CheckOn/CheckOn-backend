name: Backend CI
on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    name: 코드 빌드&테스트
    runs-on: ubuntu-latest
    # 기본값(GitHub Actions 최대 360분)까지 걸리면 훅이 멈춘 걸 아무도 못 알아챈다.
    # 정상 실행은 2~3분이므로 15분이면 재시도 여유를 두고도 충분히 빠르게 실패한다.
    timeout-minutes: 15
    steps:
      - name: 브랜치의 소스코드 가져오기
        uses: actions/checkout@v7

      - name: 테스트용 JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle #캐시 설정

      - name: gradlew 권한 설정
        run: chmod +x ./gradlew

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

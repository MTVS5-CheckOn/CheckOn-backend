name: Production Runner Smoke Test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-runner-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: 서울 배포 Runner 연결 확인
    runs-on:
      - self-hosted
      - Linux
      - X64
      - checkon-production
    timeout-minutes: 5

    steps:
      - name: Runner 기본 환경 확인
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test -d /home/ubuntu/deployment
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'architecture=%s\n' "$(uname -m)"

      - name: Docker와 Compose 실행 권한 확인
        shell: bash
        run: |
          sudo -n docker version --format 'docker-server={{.Server.Version}}'
          sudo -n docker compose version

      - name: 현재 배포 스택과 readiness 확인
        shell: bash
        working-directory: /home/ubuntu/deployment
        run: |
          sudo -n docker compose ps

          readiness_response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1/actuator/health/readiness
          )"

          test "$readiness_response" = '{"status":"UP"}'
          printf 'readiness=%s\n' "$readiness_response"
name: checkon-svc

services:
  kafka:
    image: apache/kafka:4.0.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: 'postgres:18'
    labels:
      # Flyway 관리자(POSTGRES_USER)와 런타임 역할(DB_USERNAME)을 분리하므로
      # Spring Boot가 컨테이너 관리자 계정을 DataSource에 자동 주입하면 안 된다.
      org.springframework.boot.ignore: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHECKON_APP_DB_USER: ${CHECKON_APP_DB_USER}
      CHECKON_APP_DB_PASSWORD: ${CHECKON_APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - 'checkon-pg18-data-v2:/var/lib/postgresql'
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  web:
    image: nginx
    container_name: checkon-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - back

  back:
    image: ironbear/checkon-backend:latest
    container_name: checkon-back
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${CHECKON_APP_DB_USER}
      DB_PASSWORD: ${CHECKON_APP_DB_PASSWORD}

      FLYWAY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}

      FLYWAY_DB_USER: ${POSTGRES_USER}
      FLYWAY_DB_PASSWORD: ${POSTGRES_PASSWORD}

      CHECKON_JWT_SECRET: ${CHECKON_JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
volumes:
  checkon-pg18-data-v2:

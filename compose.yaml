services:
  postgres:
    image: 'postgres:18'
    labels:
      # Flyway 관리자(POSTGRES_USER)와 런타임 역할(DB_USERNAME)을 분리하므로
      # Spring Boot가 컨테이너 관리자 계정을 DataSource에 자동 주입하면 안 된다.
      org.springframework.boot.ignore: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHECKON_APP_DB_USER: ${CHECKON_APP_DB_USER}
      CHECKON_APP_DB_PASSWORD: ${CHECKON_APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - 'checkon-pg18-data-v2:/var/lib/postgresql'
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'

volumes:
  checkon-pg18-data-v2:

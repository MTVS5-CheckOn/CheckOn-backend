services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHECKON_APP_DB_USER: ${CHECKON_APP_DB_USER}
      CHECKON_APP_DB_PASSWORD: ${CHECKON_APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - 'checkon-pg18-data-v2:/var/lib/postgresql'
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'

volumes:
  checkon-pg18-data-v2:

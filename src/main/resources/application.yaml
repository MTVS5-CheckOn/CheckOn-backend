spring:
  application:
    name: CheckOn

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

checkon:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    detect-path: ${AI_DETECT_PATH:/v1/detect}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:10s}

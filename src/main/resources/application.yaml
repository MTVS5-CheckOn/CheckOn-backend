spring:
  application:
    name: CheckOn

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: zstd
      properties:
        "[enable.idempotence]": true
        # 100명 10주 snapshot의 비압축 상한과 Kafka envelope를 수용한다.
        "[max.request.size]": 6291456
        "[max.in.flight.requests.per.connection]": 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        "[isolation.level]": read_committed
        "[max.partition.fetch.bytes]": 6291456
    listener:
      ack-mode: record

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    # Flyway는 DDL 관리자 역할만 사용한다. 관리자 자격 증명이 누락되면
    # 런타임 역할로 대체하지 않고 시작 단계에서 설정 오류를 드러낸다.
    url: ${FLYWAY_DB_URL:${DB_URL}}
    user: ${FLYWAY_DB_USER}
    password: ${FLYWAY_DB_PASSWORD}

springdoc:
  swagger-ui:
    url: /openapi/dashboard-api.yaml
    disable-swagger-default-url: true
    document-title: CheckOn API

checkon:
  security:
    test-authentication:
      enabled: false
      account-id:
      teacher-profile-id:
  tenant:
    verify-database-role: ${VERIFY_DATABASE_ROLE:true}
  auth:
    jwt-secret: ${CHECKON_JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:CHECKON_REFRESH}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    detect-path: ${AI_DETECT_PATH:/v1/detect}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    # AI 위험 탐지는 대량 snapshot을 처리할 수 있으므로 외부 계약의 최소 60초보다 길게 둔다.
    read-timeout: ${AI_READ_TIMEOUT:65s}
    detection:
      consent:
        # 동의 UI·저장 기능이 아직 없는 구현/시연 단계의 명시적 임시 정책이다.
        # 동의 기능 배포 시 REQUIRE_RECORDED_GRANT로 전환한다.
        mode: ${AI_DETECTION_CONSENT_MODE:PRE_CONSENT_ALLOW_ALL}
    problem-generation:
      adapter-base-url: ${AI_PROBLEM_ADAPTER_BASE_URL:http://localhost:8081}
      diagnosis-path: ${AI_PROBLEM_DIAGNOSIS_PATH:/internal/v1/problem-diagnoses}
      connect-timeout: ${AI_PROBLEM_CONNECT_TIMEOUT:2s}
      diagnosis-read-timeout: ${AI_PROBLEM_DIAGNOSIS_READ_TIMEOUT:10s}
      kafka:
        enabled: ${AI_PROBLEM_KAFKA_ENABLED:false}
        request-topic: ${AI_PROBLEM_REQUEST_TOPIC:checkon.ai.problem-generation.requests.v1}
        result-topic: ${AI_PROBLEM_RESULT_TOPIC:checkon.ai.problem-generation.results.v1}
        dead-letter-topic: ${AI_PROBLEM_DLT_TOPIC:checkon.backend.problem-generation.results.dlt.v1}
        consumer-group: ${AI_PROBLEM_CONSUMER_GROUP:checkon-backend-problem-generation-v1}
        outbox-batch-size: ${AI_PROBLEM_OUTBOX_BATCH_SIZE:20}
        outbox-max-attempts: ${AI_PROBLEM_OUTBOX_MAX_ATTEMPTS:5}
        outbox-publish-timeout: ${AI_PROBLEM_OUTBOX_PUBLISH_TIMEOUT:10s}
        stale-claim-after: ${AI_PROBLEM_STALE_CLAIM_AFTER:1m}
        outbox-poll-delay: ${AI_PROBLEM_OUTBOX_POLL_DELAY:1s}
    counsel:
      adapter-base-url: ${AI_COUNSEL_ADAPTER_BASE_URL:http://localhost:8081}
      drafts-path: ${AI_COUNSEL_DRAFTS_PATH:/v1/counsel/drafts}
      connect-timeout: ${AI_COUNSEL_CONNECT_TIMEOUT:2s}
      # AI-A 2026-08-20 타임아웃권고 실측(배포 반영됨): GET은 잡을 돌리지
      # 않고 현재 phase만 읽으므로 짧게 둔다 — 콜드 터널 왕복 최악 0.93초에
      # 약 10배 여유.
      get-read-timeout: ${AI_COUNSEL_GET_READ_TIMEOUT:10s}
      # refine은 여전히 동기 LLM 호출이다(배경 워커로 옮긴 건 생성뿐) — 실측
      # 8.17초, 최악 콜당 90초 재생성까지 감안해 04 §1-1의 480초를 그대로
      # 유지한다. 절대 낮추지 말 것("일괄로 내리시면 refine이 터집니다").
      refine-read-timeout: ${AI_COUNSEL_REFINE_READ_TIMEOUT:480s}
    classify:
      adapter-base-url: ${AI_CLASSIFY_ADAPTER_BASE_URL:http://localhost:8081}
      classify-path: ${AI_CLASSIFY_PATH:/v1/classify}
      confirmations-path: ${AI_CONFIRMATIONS_PATH:/v1/confirmations}
      connect-timeout: ${AI_CLASSIFY_CONNECT_TIMEOUT:2s}
      # classify/confirmations는 counsel과 달리 잡 폴링이 없는 단발 동기 호출이라
      # 짧은 타임아웃으로 충분하다.
      read-timeout: ${AI_CLASSIFY_READ_TIMEOUT:30s}
  counsel:
    polling:
      # GET은 잡을 돌리지 않으므로(§0-3) 이 폴링은 queued를 풀지 않는다 — 로컬
      # job_phase가 오래된 상태로 남지 않게 갱신만 한다. 테스트마다 AI 클라이언트를
      # 호출하지 않도록 기본은 꺼둔다.
      enabled: ${COUNSEL_POLLING_ENABLED:false}
      interval: ${COUNSEL_POLLING_INTERVAL:30s}
  kafka:
    risk-detection:
      enabled: ${CHECKON_KAFKA_ENABLED:true}
      # 독립 checkon-kafka-adapter가 정본이다. 동시에 true로 실행하지 않는다.
      http-adapter-enabled: ${RISK_DETECTION_HTTP_ADAPTER_ENABLED:false}
      requested-topic: ${RISK_DETECTION_REQUESTED_TOPIC:checkon.risk-detection.requested.v1}
      completed-topic: ${RISK_DETECTION_COMPLETED_TOPIC:checkon.risk-detection.completed.v1}
      failed-topic: ${RISK_DETECTION_FAILED_TOPIC:checkon.risk-detection.failed.v1}
      requested-consumer-group-id: ${RISK_DETECTION_ADAPTER_CONSUMER_GROUP:checkon-backend-risk-detection-http-adapter-v1}
      consumer-group-id: ${RISK_DETECTION_CONSUMER_GROUP:checkon-backend-risk-detection-v1}
      outbox-poll-delay: ${RISK_DETECTION_OUTBOX_POLL_DELAY:1s}
      outbox-lock-timeout: ${RISK_DETECTION_OUTBOX_LOCK_TIMEOUT:30s}
      outbox-retry-delay: ${RISK_DETECTION_OUTBOX_RETRY_DELAY:5s}
      producer-send-timeout: ${RISK_DETECTION_PRODUCER_SEND_TIMEOUT:10s}
      outbox-batch-size: ${RISK_DETECTION_OUTBOX_BATCH_SIZE:20}
      outbox-max-attempts: ${RISK_DETECTION_OUTBOX_MAX_ATTEMPTS:8}
    counsel-draft:
      enabled: ${COUNSEL_DRAFT_KAFKA_ENABLED:true}
      requested-topic: ${COUNSEL_DRAFT_REQUESTED_TOPIC:checkon.counsel-draft.requested.v1}
      completed-topic: ${COUNSEL_DRAFT_COMPLETED_TOPIC:checkon.counsel-draft.completed.v1}
      failed-topic: ${COUNSEL_DRAFT_FAILED_TOPIC:checkon.counsel-draft.failed.v1}
      consumer-group-id: ${COUNSEL_DRAFT_CONSUMER_GROUP:checkon-backend-counsel-draft-v1}
      outbox-poll-delay: ${COUNSEL_DRAFT_OUTBOX_POLL_DELAY:1s}
      outbox-lock-timeout: ${COUNSEL_DRAFT_OUTBOX_LOCK_TIMEOUT:30s}
      outbox-retry-delay: ${COUNSEL_DRAFT_OUTBOX_RETRY_DELAY:5s}
      producer-send-timeout: ${COUNSEL_DRAFT_PRODUCER_SEND_TIMEOUT:10s}
      outbox-batch-size: ${COUNSEL_DRAFT_OUTBOX_BATCH_SIZE:20}
      outbox-max-attempts: ${COUNSEL_DRAFT_OUTBOX_MAX_ATTEMPTS:8}

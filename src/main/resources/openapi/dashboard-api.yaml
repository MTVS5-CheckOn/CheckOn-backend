openapi: 3.0.3
info:
  title: CheckOn API
  version: 1.1.0
  description: |
    프론트엔드 화면 데이터 v1 연동 기준 계약이다. JSON 필드는 camelCase, 날짜는
    yyyy-MM-dd, Instant는 RFC 3339 date-time이며 서비스 논리 시간대는 Asia/Seoul이다.
    기본적으로 Bearer access token과 TEACHER 권한이 필요하다. 개발 프로필에서는 보호 API 전체를
    인증 헤더 없이 사용할 수 있으며 서버에 고정된 테스트 teacherProfileId를 사용한다.
    그 외 테넌트는 인증 principal의 teacherProfileId로 결정하며 teacherId/tenantId는 신뢰하지 않는다.
    통계, observing, feedbackGiven, 상담 일정, 문의, 리포트 승인 대기와 Reminder 알림 발송은 범위 밖이다.
servers:
  - url: /api/v1
    description: 환경별 호스트 뒤에 붙는 API base path (Apidog 환경에서 호스트를 설정)
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Class Management
  - name: Dashboard
  - name: Learning Records
  - name: Detection
  - name: Engagement
  - name: Todo
  - name: Problem Generation
  - name: Roster Support
    description: 대시보드 학생 실명 표시를 지원하지만 대시보드 자체 API는 아니다.
paths:
  /auth/sign-up/teachers:
    post:
      tags: [Authentication]
      operationId: signUpTeacher
      summary: 강사 회원가입
      description: 이메일을 소문자로 정규화하고 TEACHER 계정과 강사 프로필을 함께 생성한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeacherSignUpRequest'}
            example: {email: teacher@example.com, password: safe-password-123, displayName: 김서현}
      responses:
        '201':
          description: 강사 계정 생성 성공
          headers:
            Location:
              description: 생성된 Account 리소스 경로
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeacherSignUpResponse'}
        '400': {$ref: '#/components/responses/SignUpInvalidRequest'}
        '409': {$ref: '#/components/responses/EmailAlreadyExists'}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 로그인
      description: Access Token은 응답 본문으로, Refresh Token은 HttpOnly 쿠키로 발급한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: teacher@example.com, password: safe-password-123}
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: Path=/api/v1/auth로 제한된 HttpOnly Refresh Token 쿠키
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticationResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAuthentication
      summary: 인증 토큰 갱신
      description: HttpOnly Refresh Token 쿠키를 회전시키고 새 Access Token을 발급한다. 브라우저 Origin은 서버 허용 목록과 일치해야 한다.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 토큰 갱신 성공
          headers:
            Set-Cookie:
              description: 회전된 HttpOnly Refresh Token 쿠키
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticationResponse'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 현재 인증 세션 로그아웃
      description: 현재 Access Token의 세션을 폐기하고 Refresh Token 쿠키를 만료시킨다.
      responses:
        '204':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: Max-Age=0으로 만료된 Refresh Token 쿠키
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /learning-records:
    post:
      tags: [Learning Records]
      operationId: registerLearningRecord
      summary: 수동 학습 기록 등록
      description: |
        인증 강사가 현재 관리하는 학생의 원본 학습 기록을 등록한다. classGroupId가 있으면
        occurredAt 시점의 해당 반 소속도 확인한다. externalRecordRef는 nullable이며 멱등 키나
        유일 값으로 취급하지 않는다. teacherId와 sourceType은 요청에서 받지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningRecordRequest'}
            example:
              studentId: 0198c000-0000-7000-8000-000000000002
              classGroupId: 0198c000-0000-7000-8000-000000000003
              recordType: SOLVE
              occurredAt: '2026-08-03T01:00:00Z'
              correct: true
              durationSec: 120
              passageWordCount: 800
              areaTag: reading
      responses:
        '201':
          description: 학습 기록 등록 성공
          headers:
            Location:
              description: 생성된 학습 기록 경로
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LearningRecordResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningRecordTargetNotFound'}
  /detection-runs:
    post:
      tags: [Detection]
      operationId: requestDetectionRun
      summary: 위험 탐지 실행 요청
      description: |
        인증 강사의 analysisDate 기준 56일 학습 Snapshot을 준비하고 Kafka 요청 Outbox를 저장한다.
        동일 분석일과 동일 Snapshot의 재요청은 기존 실행을 재사용한다. status가 REQUESTED이면
        202, 이미 종료된 실행을 재사용하면 200을 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DetectionRunRequest'}
            example: {analysisDate: '2026-08-03'}
      responses:
        '200':
          description: 이미 종료된 동일 실행 조회
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DetectionRunResponse'}
        '202':
          description: 비동기 위험 탐지 요청 접수
          headers:
            Location:
              description: 실행 상태 조회 경로
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DetectionRunResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/DetectionConflict'}
        '422': {$ref: '#/components/responses/NoLearningRecords'}
        '502': {$ref: '#/components/responses/AiDetectionFailure'}
  /detection-runs/{runId}:
    get:
      tags: [Detection]
      operationId: getDetectionRun
      summary: 위험 탐지 실행 상태 조회
      description: 다른 강사의 실행은 존재 여부를 숨기기 위해 RUN_NOT_FOUND로 처리한다.
      parameters:
        - $ref: '#/components/parameters/DetectionRunId'
      responses:
        '200':
          description: 실행 상태 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DetectionRunStatusResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/DetectionRunNotFound'}
  /classes:
    get:
      tags: [Class Management]
      operationId: listClasses
      summary: 활성 클래스 목록 조회
      description: |
        인증 강사의 ACTIVE 클래스만 createdAt DESC, id DESC로 조회한다.
        activeStudentCount는 ACTIVE 클래스 소속만 집계한다. 화면 행 번호는
        page * size + index + 1로 프론트가 계산한다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 클래스 목록 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassPage'}
              example:
                content:
                  - classId: 0198f100-0000-7000-8000-000000000001
                    name: 수능 국어 대비 반
                    subject: 국어
                    memo: null
                    status: ACTIVE
                    activeStudentCount: 0
                    createdAt: '2026-08-09T00:00:00Z'
                    updatedAt: '2026-08-09T00:00:00Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Class Management]
      operationId: createClass
      summary: 클래스 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassDetailsRequest'}
            example: {name: 수능 국어 대비 반, subject: 국어, memo: null}
      responses:
        '201':
          description: 클래스 등록 성공
          headers:
            Location:
              description: 생성된 클래스 상세 경로
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassView'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /classes/{classId}:
    get:
      tags: [Class Management]
      operationId: getClass
      summary: 클래스 상세 조회
      description: 소유 강사는 보관된 클래스도 status와 함께 조회할 수 있다.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: 클래스 상세 조회 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassView'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/ClassNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Class Management]
      operationId: updateClass
      summary: 클래스 기본 정보 수정
      description: name, subject, memo를 현재 입력값으로 함께 교체한다. ARCHIVED 클래스는 수정할 수 없다.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassDetailsRequest'}
      responses:
        '200':
          description: 클래스 수정 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassView'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/ClassNotFound'}
        '409': {$ref: '#/components/responses/InvalidClassState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /classes/{classId}/archive:
    post:
      tags: [Class Management]
      operationId: archiveClass
      summary: 클래스 보관
      description: |
        모든 ACTIVE 소속을 같은 시각으로 종료한 뒤 클래스를 ARCHIVED로 바꾼다.
        학생, 관계, 소속과 학습 이력은 삭제하지 않는다. 반복 요청은 기존 종료
        시각과 클래스 updatedAt을 바꾸지 않는 멱등 동작이다.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: 클래스 보관 성공 또는 이미 보관됨
          content: {application/json: {schema: {$ref: '#/components/schemas/ClassView'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/ClassNotFound'}
        '409': {$ref: '#/components/responses/InvalidClassState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dashboard/briefing:
    get:
      tags: [Dashboard]
      operationId: getDashboardBriefing
      summary: 날짜별 대시보드 브리핑 조회
      description: |
        Asia/Seoul 기준 오늘 또는 과거 날짜를 조회한다. 데이터가 없어도 200과 빈 배열을 반환한다.
        Alert는 rank, alertId 순이고 Evidence는 createdAt, id 순이다. Todo는 조회일까지 미완료인
        항목(이월 포함)을 dueDate, createdAt, id 순으로 반환한다. Reminder는 조회일 다음 날 00:00
        미만에 예정된 ACTIVE Reminder와 OPEN Intervention만 Alert별로 묶고, 최신 Intervention을 대표로
        선택해 scheduledAt, alertId 순으로 반환한다. studentName 미등록 시 null이며 alias로 대체하지 않는다.
      parameters:
        - $ref: '#/components/parameters/BriefingDate'
      responses:
        '200':
          description: 브리핑 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardBriefing'}
              example:
                date: '2026-08-05'
                alerts:
                  - alertId: 0198f000-0000-7000-8000-000000000101
                    studentId: 0198f000-0000-7000-8000-000000000003
                    studentName: null
                    ruleId: R1
                    signalType: hidden_risk
                    rank: 1
                    brief: 최근 학습 신호를 확인해 주세요.
                    briefFallback: false
                    status: PENDING_REVIEW
                    evidence: [{recordId: record-1, summary: 최근 오답률이 증가했습니다.}]
                todos: []
                reminders: []
        '400':
          description: 누락/날짜 형식 오류 또는 미래 날짜
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                future: {value: {code: FUTURE_DATE_NOT_ALLOWED, message: Future briefing dates cannot be queried.}}
                missing: {value: {code: MISSING_REQUEST_PARAMETER, message: 필수 요청 파라미터를 확인해 주세요.}}
                format: {value: {code: INVALID_DATE_FORMAT, message: 날짜는 yyyy-MM-dd 형식이어야 합니다.}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dashboard/calendar:
    get:
      tags: [Dashboard]
      operationId: getDashboardCalendar
      summary: 주간 대시보드 캘린더 조회
      description: |
        startedAt 월요일부터 같은 주 endedAt 일요일까지 정확히 7일을 날짜 오름차순으로 반환한다.
        미래 주도 허용하며 빈 날짜는 eventCount 0이다. eventCount는 detection_runs.analysis_date에
        연결된 Alert 수로, 상태와 Evidence 수에 무관하게 Alert 한 건을 한 번 센다. Todo, Reminder,
        상담 일정 등은 포함하지 않는다.
      parameters:
        - $ref: '#/components/parameters/StartedAt'
        - $ref: '#/components/parameters/EndedAt'
      responses:
        '200':
          description: 7일 캘린더 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardCalendar'}
              example:
                startedAt: '2026-08-03'
                endedAt: '2026-08-09'
                items:
                  - {date: '2026-08-03', eventCount: 2}
                  - {date: '2026-08-04', eventCount: 0}
                  - {date: '2026-08-05', eventCount: 1}
                  - {date: '2026-08-06', eventCount: 0}
                  - {date: '2026-08-07', eventCount: 0}
                  - {date: '2026-08-08', eventCount: 0}
                  - {date: '2026-08-09', eventCount: 0}
        '400':
          description: 누락, 날짜 형식 오류 또는 잘못된 주간 범위
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missing: {value: {code: MISSING_REQUEST_PARAMETER, message: 필수 요청 파라미터를 확인해 주세요.}}
                format: {value: {code: INVALID_DATE_FORMAT, message: 날짜는 yyyy-MM-dd 형식이어야 합니다.}}
                range: {value: {code: INVALID_CALENDAR_RANGE, message: The calendar range must be one Monday-through-Sunday week.}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/alerts:
    get:
      tags: [Engagement]
      operationId: listEngagementAlerts
      summary: 상태별 Alert 검토 큐 조회
      description: 브리핑이 아니라 상태별 검토 큐 탐색용 목록이다. createdAt, id 오름차순이다.
      parameters:
        - name: status
          in: query
          required: false
          description: 생략 시 PENDING_REVIEW
          schema: {$ref: '#/components/schemas/AlertStatus'}
          example: PENDING_REVIEW
      responses:
        '200':
          description: Alert 목록(없으면 빈 배열)
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AlertView'}}
              example: []
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/alerts/{alertId}:
    get:
      tags: [Engagement]
      operationId: getEngagementAlertDetail
      summary: Alert 상세 조회
      description: alertId 하나로 학생·반·신호 표시 정보와 생성순 Evidence를 반환한다.
      parameters: [{$ref: '#/components/parameters/AlertId'}]
      responses:
        '200':
          description: 상세 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertDetail'}
              example:
                alertId: 0198f000-0000-7000-8000-000000000101
                studentId: 0198f000-0000-7000-8000-000000000003
                studentName: 김서연
                className: 고1 수능 국어반
                ruleId: R4
                signalType: hidden_risk
                displayLabel: 숨은 신호 · 풀이시간 급증
                brief: 최근 풀이시간이 개인 기준보다 증가했습니다.
                briefFallback: false
                status: PENDING_REVIEW
                createdAt: '2026-08-05T00:00:00Z'
                evidence: [{id: 0198f000-0000-7000-8000-000000000301, sourceHint: learning_records, recordId: record-1, summary: 근거}]
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/alerts/{alertId}/approval:
    post:
      tags: [Engagement]
      operationId: approveEngagementAlert
      summary: Alert 승인
      description: PENDING_REVIEW Alert를 승인한다. 연결된 OPEN Todo도 완료한다. 이미 승인된 경우 멱등이다.
      parameters: [{$ref: '#/components/parameters/AlertId'}]
      responses:
        '200': {$ref: '#/components/responses/AlertViewSuccess'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/alerts/{alertId}/rejection:
    post:
      tags: [Engagement]
      operationId: rejectEngagementAlert
      summary: Alert 거절
      description: PENDING_REVIEW Alert를 사유와 함께 거절하고 연결된 OPEN Todo를 완료한다.
      parameters: [{$ref: '#/components/parameters/AlertId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectionRequest'}
            example: {note: 오경보로 판단했습니다.}
      responses:
        '200': {$ref: '#/components/responses/AlertViewSuccess'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/alerts/{alertId}/interventions:
    post:
      tags: [Engagement]
      operationId: createAlertIntervention
      summary: Alert 기반 Intervention 생성
      description: APPROVED Alert에 OPEN Intervention과 7일 뒤 ACTIVE Reminder를 같은 트랜잭션에서 생성한다.
      parameters: [{$ref: '#/components/parameters/AlertId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InterventionRequest'}
            example: {type: CALL, content: 전화 상담을 진행했습니다.}
      responses:
        '200':
          description: 생성 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/InterventionView'}, example: {id: 0198f000-0000-7000-8000-000000000401, alertId: 0198f000-0000-7000-8000-000000000101, studentId: 0198f000-0000-7000-8000-000000000003, type: CALL, content: 전화 상담을 진행했습니다., status: OPEN, createdAt: '2026-08-05T00:00:00Z'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/interventions/{interventionId}/completion:
    post:
      tags: [Engagement]
      operationId: completeIntervention
      summary: Intervention 완료
      description: OPEN Intervention을 COMPLETED로 전환한다. 연결 Reminder는 변경하지 않는다.
      parameters: [{$ref: '#/components/parameters/InterventionId'}]
      responses:
        '200': {$ref: '#/components/responses/InterventionViewSuccess'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/interventions/{interventionId}/cancellation:
    post:
      tags: [Engagement]
      operationId: cancelIntervention
      summary: Intervention 취소
      description: OPEN Intervention과 연결된 ACTIVE Reminder를 같은 시각에 취소한다.
      parameters: [{$ref: '#/components/parameters/InterventionId'}]
      responses:
        '200': {$ref: '#/components/responses/InterventionViewSuccess'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /todos/{todoId}:
    patch:
      tags: [Todo]
      operationId: completeTodo
      summary: Todo 완료
      description: done=true만 지원하며 반복 완료는 멱등이다. false로 완료 취소/재개할 수 없다.
      parameters: [{$ref: '#/components/parameters/TodoId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoUpdateRequest'}
            example: {done: true}
      responses:
        '200':
          description: 완료 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/TodoResult'}, example: {todoId: 0198f000-0000-7000-8000-000000000501, kind: ALERT_FOLLOW_UP, done: true, completedAt: '2026-08-05T00:00:00Z'}}}
        '400':
          description: 본문 오류 또는 done이 true가 아님
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, examples: {invalid: {value: {code: INVALID_TODO_UPDATE, message: done=true만 지원합니다.}}}}}
        '404':
          description: 없거나 접근 불가능한 Todo
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: TODO_NOT_FOUND, message: Todo를 찾을 수 없습니다.}}}
        '409':
          description: 완료할 수 없는 상태
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: INVALID_TODO_STATE, message: 현재 상태에서는 요청을 처리할 수 없습니다.}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/reminders/{reminderId}/completion:
    post:
      tags: [Engagement]
      operationId: completeReminder
      summary: Reminder 완료
      description: ACTIVE Reminder를 COMPLETED로 전환한다.
      parameters: [{$ref: '#/components/parameters/ReminderId'}]
      responses:
        '200': {$ref: '#/components/responses/ReminderViewSuccess'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /engagement/reminders/{reminderId}/cancellation:
    post:
      tags: [Engagement]
      operationId: cancelReminder
      summary: Reminder 취소
      description: ACTIVE Reminder를 CANCELLED로 전환한다.
      parameters: [{$ref: '#/components/parameters/ReminderId'}]
      responses:
        '200': {$ref: '#/components/responses/ReminderViewSuccess'}
        '404': {$ref: '#/components/responses/EngagementNotFound'}
        '409': {$ref: '#/components/responses/InvalidEngagementState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /students/{studentId}/personal-information/name:
    put:
      tags: [Roster Support]
      operationId: saveStudentPersonalInformationName
      summary: 학생 실명 저장
      description: 대시보드 studentName 표시를 지원한다. 다른 테넌트 학생은 존재 여부를 숨겨 같은 404를 반환한다.
      parameters: [{$ref: '#/components/parameters/StudentId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StudentNameRequest'}
            example: {studentName: 김서연}
      responses:
        '200':
          description: 저장 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/StudentNameResponse'}, example: {studentId: 0198f000-0000-7000-8000-000000000003, studentName: 김서연, updatedAt: '2026-08-05T00:00:00Z'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404':
          description: 없거나 접근 불가능한 학생
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: STUDENT_NOT_FOUND, message: 학생을 찾을 수 없습니다.}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /problem-requests:
    post:
      tags: [Problem Generation]
      operationId: createProblemGenerationRequest
      summary: AI 문제 출제 요청
      description: |
        v1은 teacher_manual + manualTargets, language, 객관식, 지문 없음만 지원한다.
        요청과 Kafka Outbox를 같은 DB 트랜잭션에 저장하며, 동일 멱등 키와 동일
        payload는 기존 요청을 반환한다. AI 서버에는 내부 UUID와 실명을 전달하지 않는다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProblemGenerationRequest'}
            example:
              targetKind: STUDENT
              targetId: 0198f000-0000-7000-8000-000000000003
              manualTargets: [skill.grammar.001]
              taxonomyVersion: '2026.08'
              typeTags: [CONCEPT]
              count: 3
              requestedDifficulty: MEDIUM
      responses:
        '202':
          description: 요청 저장 성공 또는 동일 요청 재사용
          headers:
            Location:
              description: 백엔드가 영속화한 출제 요청 조회 경로
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProblemGenerationResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 없거나 다른 테넌트에 속한 학생 또는 클래스
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: PROBLEM_TARGET_NOT_FOUND, message: 출제 대상을 찾을 수 없습니다.}}}
        '409':
          description: 같은 멱등 키가 다른 payload에 사용됨
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: IDEMPOTENCY_CONFLICT, message: 같은 멱등 키가 다른 요청에 이미 사용되었습니다.}}}
  /problem-requests/{requestId}:
    get:
      tags: [Problem Generation]
      operationId: getProblemGenerationRequest
      summary: 문제 출제 요청 상태와 결과 조회
      description: AI 인메모리 상태가 아니라 백엔드 DB에 미러링된 상태와 원본 결과를 조회한다.
      parameters:
        - $ref: '#/components/parameters/ProblemRequestId'
      responses:
        '200':
          description: 출제 요청 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProblemGenerationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 없거나 다른 테넌트에 속한 출제 요청
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: PROBLEM_REQUEST_NOT_FOUND, message: 출제 요청을 찾을 수 없습니다.}}}
  /problem-studio/students:
    get:
      tags: [Problem Studio]
      operationId: listProblemStudioStudents
      summary: Step 1 대상 학생 목록
      description: ACTIVE 학생의 화면 표시 정보와 최근 30일 이상 신호 수를 페이지로 조회한다.
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {description: 대상 학생 목록, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioStudentPage'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /problem-studio/students/{studentId}/weakness-analysis:
    get:
      tags: [Problem Studio]
      operationId: getProblemStudioWeaknessAnalysis
      summary: Step 1 최근 8주 영역·유형 분석
      parameters: [{$ref: '#/components/parameters/StudentId'}]
      responses:
        '200': {description: 최근 8주 분석, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioWeaknessAnalysis'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없거나 접근할 수 없는 학생, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /problem-studio/requests:
    post:
      tags: [Problem Studio]
      operationId: createProblemStudioRequest
      summary: Step 2 영역별 출제 조건으로 생성 요청
      description: 영역×유형별 문항 수의 합계는 1~20이며 요청과 Kafka Outbox를 원자 저장한다.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioRequest'}}}
      responses:
        '202': {description: 요청 저장, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioRequestResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없거나 접근할 수 없는 학생, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 멱등 키 충돌, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /problem-studio/requests/{requestId}/review:
    get:
      tags: [Problem Studio]
      operationId: getProblemStudioReview
      summary: Step 3 AI 생성 문항 검토 조회
      parameters: [{$ref: '#/components/parameters/ProblemRequestId'}]
      responses:
        '200': {description: 문항과 검증 상태 집계, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioReview'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 없거나 접근할 수 없는 요청, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /problem-studio/requests/{requestId}/selection:
    put:
      tags: [Problem Studio]
      operationId: replaceProblemStudioSelection
      summary: Step 4 선택 문항 교체
      parameters: [{$ref: '#/components/parameters/ProblemRequestId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioSelectionRequest'}}}}
      responses:
        '200': {description: 선택이 반영된 검토 모델, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioReview'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 요청 없음, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 저장 이후 선택 변경 등 상태 충돌, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /problem-studio/requests/{requestId}/save:
    post:
      tags: [Problem Studio]
      operationId: saveProblemStudioSet
      summary: Step 4 선택 문항 저장
      parameters: [{$ref: '#/components/parameters/ProblemRequestId'}]
      responses:
        '200': {description: 동일 요청은 같은 저장 세트 반환, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioSavedSet'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 요청 없음, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 저장 불가능 상태, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /problem-studio/requests/{requestId}/publish:
    post:
      tags: [Problem Studio]
      operationId: publishProblemStudioAssignment
      summary: Step 4 대상 학생에게 과제 발행
      parameters: [{$ref: '#/components/parameters/ProblemRequestId'}]
      responses:
        '200': {description: 동일 요청은 같은 발행 과제 반환, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioAssignment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 요청 없음, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 발행 불가능 상태, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /problem-studio/requests/{requestId}/printable:
    get:
      tags: [Problem Studio]
      operationId: getProblemStudioPrintableData
      summary: Step 4 프론트 PDF 렌더링용 데이터
      parameters: [{$ref: '#/components/parameters/ProblemRequestId'}]
      responses:
        '200': {description: 선택 문항과 대상 학생 인쇄 데이터, content: {application/json: {schema: {$ref: '#/components/schemas/ProblemStudioPrintable'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 요청 없음, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 선택 문항 없음, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    refreshCookie:
      type: apiKey
      in: cookie
      name: CHECKON_REFRESH
      description: 실제 쿠키 이름은 서버의 REFRESH_COOKIE_NAME 설정으로 변경할 수 있다.
  parameters:
    BriefingDate: {name: date, in: query, required: true, schema: {type: string, format: date}, example: '2026-08-05'}
    StartedAt: {name: startedAt, in: query, required: true, description: 월요일, schema: {type: string, format: date}, example: '2026-08-03'}
    EndedAt: {name: endedAt, in: query, required: true, description: 같은 주 일요일, schema: {type: string, format: date}, example: '2026-08-09'}
    AlertId: {name: alertId, in: path, required: true, schema: {type: string, format: uuid}}
    InterventionId: {name: interventionId, in: path, required: true, schema: {type: string, format: uuid}}
    ReminderId: {name: reminderId, in: path, required: true, schema: {type: string, format: uuid}}
    TodoId: {name: todoId, in: path, required: true, schema: {type: string, format: uuid}}
    StudentId: {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
    ClassId: {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
    ProblemRequestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    DetectionRunId: {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일 논리 요청의 재시도에서는 같은 값을 사용한다.
      schema: {type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$'}
    Page: {name: page, in: query, required: false, description: 0부터 시작, schema: {type: integer, format: int32, minimum: 0, default: 0}}
    Size: {name: size, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
  responses:
    Unauthorized: {description: 인증 실패. Security filter가 생성하므로 JSON 오류 본문은 보장되지 않는다.}
    Forbidden: {description: TEACHER 권한이 아님. Security가 생성하므로 JSON 오류 본문은 보장되지 않는다.}
    InvalidRequest:
      description: 요청 값 오류
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: INVALID_REQUEST, message: 요청 값을 확인해 주세요.}}}
    SignUpInvalidRequest:
      description: 회원가입 요청 값 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TeacherSignUpErrorResponse'}
          example:
            code: INVALID_REQUEST
            message: 요청 값을 확인해 주세요.
            fieldErrors: [{field: email, message: 공백일 수 없습니다}]
    EmailAlreadyExists:
      description: 이미 가입된 이메일
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TeacherSignUpErrorResponse'}
          example: {code: EMAIL_ALREADY_EXISTS, message: 이미 가입된 이메일입니다., fieldErrors: []}
    AuthenticationFailed:
      description: 자격 증명 오류 또는 비활성 계정
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            credentials: {value: {code: INVALID_CREDENTIALS, message: 이메일 또는 비밀번호를 확인해 주세요.}}
            inactive: {value: {code: ACCOUNT_NOT_ACTIVE, message: 사용할 수 없는 계정입니다.}}
    InvalidSession:
      description: Refresh Token이 없거나 세션이 만료·폐기됨
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: SESSION_INVALID, message: 인증 세션이 유효하지 않습니다.}}}
    OriginNotAllowed:
      description: 브라우저 Origin이 서버 허용 목록과 불일치
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: ORIGIN_NOT_ALLOWED, message: 허용되지 않은 요청입니다.}}}
    LearningRecordTargetNotFound:
      description: 관리하지 않는 학생·반 또는 occurredAt 시점에 유효하지 않은 반 소속
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: LEARNING_RECORD_TARGET_NOT_FOUND, message: 등록 대상 학생 또는 반을 찾을 수 없습니다.}}}
    DetectionConflict:
      description: 동일 분석일의 Snapshot 충돌 또는 허용되지 않는 실행 상태
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            idempotency: {value: {code: IDEMPOTENCY_CONFLICT, message: 같은 분석일에 다른 학습 snapshot이 이미 준비되었습니다.}}
            state: {value: {code: DETECTION_RUN_STATE_CONFLICT, message: 현재 Detection 실행 상태에서는 요청을 처리할 수 없습니다.}}
    NoLearningRecords:
      description: 분석할 활성 학생 또는 학습 근거가 없음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: NO_LEARNING_RECORDS, message: 분석 기간에 학습 기록이 없습니다.}}}
    AiDetectionFailure:
      description: AI 연동 또는 Detection 결과 처리 실패
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: AI_SERVER_ERROR, message: AI 분석 요청에 실패했습니다.}}}
    DetectionRunNotFound:
      description: 없거나 다른 테넌트에 속한 Detection 실행
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: RUN_NOT_FOUND, message: Detection 실행을 찾을 수 없습니다.}}}
    ClassNotFound:
      description: 없거나 다른 테넌트에 속한 클래스
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: CLASS_NOT_FOUND, message: 클래스를 찾을 수 없습니다.}}}
    InvalidClassState:
      description: 보관된 클래스 수정 또는 보관 불변식 위반
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: INVALID_CLASS_STATE, message: 현재 클래스 상태에서는 요청을 처리할 수 없습니다.}}}
    EngagementNotFound:
      description: 없거나 다른 테넌트에 속한 리소스
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: ENGAGEMENT_RESOURCE_NOT_FOUND, message: 대상을 찾을 수 없습니다.}}}
    InvalidEngagementState:
      description: 허용되지 않는 상태 전이
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}, example: {code: INVALID_ENGAGEMENT_STATE, message: 현재 상태에서는 요청을 처리할 수 없습니다.}}}
    AlertViewSuccess:
      description: Alert 상태 변경 성공
      content: {application/json: {schema: {$ref: '#/components/schemas/AlertView'}, example: {id: 0198f000-0000-7000-8000-000000000101, studentId: 0198f000-0000-7000-8000-000000000003, detectionSignalResultId: 0198f000-0000-7000-8000-000000000201, status: APPROVED, decisionNote: null, decidedAt: '2026-08-05T00:00:00Z', createdAt: '2026-08-05T00:00:00Z'}}}
    InterventionViewSuccess:
      description: Intervention 상태 변경 성공
      content: {application/json: {schema: {$ref: '#/components/schemas/InterventionView'}}}
    ReminderViewSuccess:
      description: Reminder 상태 변경 성공
      content: {application/json: {schema: {$ref: '#/components/schemas/ReminderView'}}}
  schemas:
    AccountRole: {type: string, enum: [TEACHER, PARENT, STUDENT]}
    TeacherSignUpRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, maxLength: 320, description: 앞뒤 공백 제거 후 소문자로 정규화한다.}
        password: {type: string, format: password, minLength: 8, writeOnly: true}
        displayName: {type: string, minLength: 1, maxLength: 80}
    TeacherSignUpResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TeacherSignUpData'}
    TeacherSignUpData:
      type: object
      required: [accountId, teacherId, role, email]
      properties:
        accountId: {type: string, format: uuid}
        teacherId: {type: string, format: uuid}
        role: {type: string, enum: [TEACHER]}
        email: {type: string, format: email}
    TeacherSignUpErrorResponse:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code: {type: string}
        message: {type: string}
        fieldErrors: {type: array, items: {$ref: '#/components/schemas/FieldViolation'}}
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 320}
        password: {type: string, format: password, maxLength: 200, writeOnly: true}
    AuthenticationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/AuthenticationData'}
    AuthenticationData:
      type: object
      required: [accessToken, accessTokenExpiresAt, account]
      properties:
        accessToken: {type: string, description: Bearer Access Token}
        accessTokenExpiresAt: {type: string, format: date-time}
        account: {$ref: '#/components/schemas/AuthenticatedAccount'}
    AuthenticatedAccount:
      type: object
      required: [id, role, email, teacherProfileId]
      properties:
        id: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/AccountRole'}
        email: {type: string, format: email}
        teacherProfileId: {type: string, format: uuid, nullable: true}
    LearningRecordType: {type: string, enum: [SOLVE, SUBMIT]}
    LearningRecordRequest:
      type: object
      required: [studentId, recordType, occurredAt]
      properties:
        studentId: {type: string, format: uuid}
        classGroupId: {type: string, format: uuid, nullable: true}
        recordType: {$ref: '#/components/schemas/LearningRecordType'}
        occurredAt: {type: string, format: date-time}
        externalRecordRef: {type: string, maxLength: 255, nullable: true, description: 유일성이나 멱등성을 보장하지 않는 외부 참조}
        correct: {type: boolean, nullable: true}
        durationSec: {type: integer, format: int32, minimum: 0, nullable: true}
        passageWordCount: {type: integer, format: int32, minimum: 0, nullable: true}
        areaTag: {type: string, maxLength: 80, nullable: true}
        subjectTrack: {type: string, maxLength: 80, nullable: true}
        typeTag: {type: string, maxLength: 80, nullable: true}
        itemFormat: {type: string, maxLength: 80, nullable: true}
        assignmentTitleText: {type: string, maxLength: 255, nullable: true}
    LearningRecordResponse:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    DetectionRunStatus: {type: string, enum: [PREPARED, REQUESTED, SUCCEEDED, FAILED]}
    DetectionRunRequest:
      type: object
      required: [analysisDate]
      properties:
        analysisDate: {type: string, format: date}
    DetectionRunResponse:
      type: object
      required: [runId, status, analysisDate, created, attemptNumber]
      properties:
        runId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DetectionRunStatus'}
        analysisDate: {type: string, format: date}
        created: {type: boolean, description: 새 실행을 생성했으면 true, 기존 실행을 재사용하면 false}
        attemptNumber: {type: integer, format: int32, minimum: 1}
    DetectionRunStatusResponse:
      type: object
      required: [runId, status, analysisDate, attemptCount, errorCode]
      properties:
        runId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DetectionRunStatus'}
        analysisDate: {type: string, format: date}
        attemptCount: {type: integer, format: int32, minimum: 0}
        errorCode: {type: string, nullable: true}
    ClassStatus: {type: string, enum: [ACTIVE, ARCHIVED]}
    ClassDetailsRequest:
      type: object
      required: [name, subject]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        subject: {type: string, minLength: 1, maxLength: 100, description: 표시용 자유 문자열. 앞뒤 공백은 제거된다.}
        memo: {type: string, maxLength: 1000, nullable: true}
    ClassView:
      type: object
      required: [classId, name, subject, memo, status, activeStudentCount, createdAt, updatedAt]
      properties:
        classId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        subject: {type: string, minLength: 1, maxLength: 100, nullable: true, description: V12 이전 행은 교사가 수정하기 전까지 null일 수 있다. 신규 등록과 수정 입력에서는 필수다.}
        memo: {type: string, maxLength: 1000, nullable: true}
        status: {$ref: '#/components/schemas/ClassStatus'}
        activeStudentCount: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ClassPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ClassView'}}
        page: {type: integer, format: int32, minimum: 0}
        size: {type: integer, format: int32, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int64, minimum: 0}
    AlertStatus: {type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED]}
    InterventionStatus: {type: string, enum: [OPEN, COMPLETED, CANCELLED]}
    ReminderStatus: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED]}
    DashboardBriefing:
      type: object
      required: [date, alerts, todos, reminders]
      properties:
        date: {type: string, format: date}
        alerts: {type: array, items: {$ref: '#/components/schemas/DashboardAlert'}}
        todos: {type: array, items: {$ref: '#/components/schemas/DashboardTodo'}}
        reminders: {type: array, items: {$ref: '#/components/schemas/DashboardReminder'}}
    DashboardAlert:
      type: object
      required: [alertId, studentId, studentName, className, ruleId, signalType, displayLabel, rank, brief, briefFallback, status, createdAt, evidence]
      properties:
        alertId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        studentName: {type: string, nullable: true, description: key는 존재하며 미등록 시 null. alias로 대체하지 않는다.}
        className: {type: string, nullable: true, description: 신호 class_ref를 현재 강사 소유 반으로 해석하지 못하면 null.}
        ruleId: {type: string}
        signalType: {type: string}
        displayLabel: {type: string}
        rank: {type: integer, format: int32}
        brief: {type: string}
        briefFallback: {type: boolean}
        status: {$ref: '#/components/schemas/AlertStatus'}
        createdAt: {type: string, format: date-time}
        evidence: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DashboardEvidence'}}
    DashboardEvidence:
      type: object
      required: [recordId, summary]
      properties: {recordId: {type: string}, summary: {type: string}}
    DashboardTodo:
      type: object
      required: [todoId, kind, text, displayLabel, createdAt, ref, dueDate, done]
      properties:
        todoId: {type: string, format: uuid}
        kind: {type: string, enum: [ALERT_FOLLOW_UP]}
        text: {type: string}
        displayLabel: {type: string}
        createdAt: {type: string, format: date-time}
        ref: {$ref: '#/components/schemas/DashboardTodoRef'}
        dueDate: {type: string, format: date}
        done: {type: boolean, enum: [false]}
    DashboardTodoRef:
      type: object
      required: [alertId, screen]
      properties: {alertId: {type: string, format: uuid}, screen: {type: string, enum: [alert_detail]}}
    DashboardReminder:
      type: object
      required: [reminderId, alertId, studentId, studentName, interventionCount, latestIntervention, scheduledAt]
      properties:
        reminderId: {type: string, format: uuid}
        alertId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        studentName: {type: string, nullable: true, description: key는 존재하며 미등록 시 null. alias로 대체하지 않는다.}
        interventionCount: {type: integer, format: int64, minimum: 1}
        latestIntervention: {$ref: '#/components/schemas/LatestIntervention'}
        scheduledAt: {type: string, format: date-time}
    LatestIntervention:
      type: object
      required: [interventionId, type, summary, createdAt]
      properties:
        interventionId: {type: string, format: uuid}
        type: {type: string, description: 현재 자유 문자열이며 표준 enum은 미확정}
        summary: {type: string, enum: [개입 후 재확인이 예정되어 있습니다.]}
        createdAt: {type: string, format: date-time}
    DashboardCalendar:
      type: object
      required: [startedAt, endedAt, items]
      properties:
        startedAt: {type: string, format: date}
        endedAt: {type: string, format: date}
        items: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/DashboardCalendarItem'}}
    DashboardCalendarItem:
      type: object
      required: [date, eventCount]
      properties: {date: {type: string, format: date}, eventCount: {type: integer, format: int64, minimum: 0}}
    AlertView:
      type: object
      required: [id, studentId, detectionSignalResultId, status, decisionNote, decidedAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        detectionSignalResultId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AlertStatus'}
        decisionNote: {type: string, nullable: true, description: PENDING_REVIEW와 승인 시 null, 거절 시 사유}
        decidedAt: {type: string, format: date-time, nullable: true, description: PENDING_REVIEW이면 null}
        createdAt: {type: string, format: date-time}
    AlertDetail:
      type: object
      required: [alertId, studentId, studentName, className, ruleId, signalType, displayLabel, brief, briefFallback, status, createdAt, evidence]
      properties:
        alertId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        studentName: {type: string, nullable: true, description: key는 존재하며 미등록 시 null. alias로 대체하지 않는다.}
        className: {type: string, nullable: true, description: 신호 class_ref를 현재 강사 소유 반으로 해석하지 못하면 null.}
        ruleId: {type: string}
        signalType: {type: string}
        displayLabel: {type: string}
        brief: {type: string}
        briefFallback: {type: boolean}
        status: {$ref: '#/components/schemas/AlertStatus'}
        createdAt: {type: string, format: date-time}
        evidence: {type: array, items: {$ref: '#/components/schemas/EvidenceView'}}
    EvidenceView:
      type: object
      required: [id, sourceHint, recordId, summary]
      properties: {id: {type: string, format: uuid}, sourceHint: {type: string}, recordId: {type: string}, summary: {type: string}}
    InterventionView:
      type: object
      required: [id, alertId, studentId, type, content, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        alertId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        type: {type: string}
        content: {type: string}
        status: {$ref: '#/components/schemas/InterventionStatus'}
        createdAt: {type: string, format: date-time}
    ReminderView:
      type: object
      required: [id, interventionId, scheduledAt, status]
      properties:
        id: {type: string, format: uuid}
        interventionId: {type: string, format: uuid}
        scheduledAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/ReminderStatus'}
    TodoUpdateRequest:
      type: object
      required: [done]
      additionalProperties: false
      properties: {done: {type: boolean, enum: [true]}}
    TodoResult:
      type: object
      required: [todoId, kind, done, completedAt]
      properties:
        todoId: {type: string, format: uuid}
        kind: {type: string, enum: [ALERT_FOLLOW_UP]}
        done: {type: boolean, enum: [true]}
        completedAt: {type: string, format: date-time}
    RejectionRequest:
      type: object
      required: [note]
      properties: {note: {type: string, minLength: 1, maxLength: 2000}}
    InterventionRequest:
      type: object
      required: [type, content]
      properties:
        type: {type: string, minLength: 1, maxLength: 40, description: 표준 enum 정책은 미확정}
        content: {type: string, minLength: 1, maxLength: 4000}
    StudentNameRequest:
      type: object
      required: [studentName]
      properties: {studentName: {type: string, minLength: 1, maxLength: 100}}
    StudentNameResponse:
      type: object
      required: [studentId, studentName, updatedAt]
      properties: {studentId: {type: string, format: uuid}, studentName: {type: string}, updatedAt: {type: string, format: date-time}}
    ProblemTargetKind: {type: string, enum: [STUDENT, CLASS]}
    ProblemTypeTag: {type: string, enum: [FACT, INFER, CRITIC, CONCEPT]}
    ProblemDifficulty: {type: string, enum: [LOW, MEDIUM, HIGH]}
    ProblemGenerationStatus:
      type: string
      enum: [QUEUED, DISPATCHED, RUNNING, SUCCEEDED, PARTIAL_SUCCESS, FAILED, CANCELLED, DELIVERY_FAILED]
    ProblemGenerationRequest:
      type: object
      additionalProperties: false
      required: [targetKind, targetId, manualTargets, taxonomyVersion, typeTags, count]
      properties:
        targetKind: {$ref: '#/components/schemas/ProblemTargetKind'}
        targetId: {type: string, format: uuid}
        manualTargets:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 120, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]*$'}
        taxonomyVersion: {type: string, minLength: 1, maxLength: 80}
        typeTags:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/ProblemTypeTag'}
        count: {type: integer, format: int32, minimum: 1, maximum: 10}
        requestedDifficulty:
          allOf: [{$ref: '#/components/schemas/ProblemDifficulty'}]
          nullable: true
    ProblemGenerationResponse:
      type: object
      required:
        - requestId
        - targetKind
        - status
        - requestedAt
        - replayed
      properties:
        requestId: {type: string, format: uuid}
        targetKind: {$ref: '#/components/schemas/ProblemTargetKind'}
        status: {$ref: '#/components/schemas/ProblemGenerationStatus'}
        jobId: {type: string, nullable: true}
        executionId: {type: string, nullable: true}
        setId: {type: string, nullable: true}
        resultStatus: {type: string, nullable: true}
        errorCode: {type: string, nullable: true}
        result: {type: object, nullable: true, additionalProperties: true}
        versions: {type: object, nullable: true, additionalProperties: true}
        requestedAt: {type: string, format: date-time}
        dispatchedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        replayed: {type: boolean, description: 동일 멱등 키와 동일 payload로 기존 요청을 재사용했는지 여부}
    ProblemStudioStudentPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ProblemStudioStudent'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    ProblemStudioStudent:
      type: object
      required: [studentId, studentName, managedDays, recentSignalCount]
      properties:
        studentId: {type: string, format: uuid}
        studentName: {type: string}
        className: {type: string, nullable: true}
        subject: {type: string, nullable: true}
        managedDays: {type: integer, format: int64, minimum: 1}
        recentSignalCount: {type: integer, minimum: 0}
        notableSummary: {type: string, nullable: true}
    ProblemStudioWeaknessAnalysis:
      type: object
      required: [studentId, windowStart, windowEnd, minimumSampleSize, cells]
      properties:
        studentId: {type: string, format: uuid}
        windowStart: {type: string, format: date}
        windowEnd: {type: string, format: date}
        minimumSampleSize: {type: integer, enum: [10]}
        studentAveragePercent: {type: number, nullable: true}
        cells: {type: array, items: {$ref: '#/components/schemas/ProblemStudioWeaknessCell'}}
    ProblemStudioWeaknessCell:
      type: object
      required: [areaTag, typeTag, solvedCount, correctCount, evaluation]
      properties:
        areaTag: {type: string}
        typeTag: {type: string, enum: [FACT, INFER, CRITIC, CONCEPT]}
        solvedCount: {type: integer, minimum: 0}
        correctCount: {type: integer, minimum: 0}
        accuracyPercent: {type: number, nullable: true}
        gapFromStudentAveragePercent: {type: number, nullable: true}
        evaluation: {type: string, enum: [GOOD, WEAK_SIGNAL, WEAK_CONFIRMED, ON_HOLD]}
    ProblemStudioRequest:
      type: object
      additionalProperties: false
      required: [studentId, targets, difficulty]
      properties:
        studentId: {type: string, format: uuid}
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ProblemStudioTarget'}
        difficulty: {$ref: '#/components/schemas/ProblemDifficulty'}
    ProblemStudioTarget:
      type: object
      additionalProperties: false
      required: [areaTag, typeTag, count]
      properties:
        areaTag: {type: string, minLength: 1, maxLength: 80}
        typeTag: {$ref: '#/components/schemas/ProblemTypeTag'}
        count: {type: integer, minimum: 1, maximum: 20}
    ProblemStudioRequestResponse:
      type: object
      required: [requestId, status, replayed]
      properties:
        requestId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ProblemGenerationStatus'}
        replayed: {type: boolean}
    ProblemValidationStatus: {type: string, enum: [PASSED, REVIEW_REQUIRED, UNVERIFIABLE, EXCLUDED]}
    ProblemStudioReview:
      type: object
      required: [requestId, requestStatus, projectionStatus, counts, items]
      properties:
        requestId: {type: string, format: uuid}
        requestStatus: {$ref: '#/components/schemas/ProblemGenerationStatus'}
        projectionStatus: {type: string, enum: [PENDING, PROJECTED, PARTIAL, UNSUPPORTED]}
        projectionErrorCode: {type: string, nullable: true}
        counts: {$ref: '#/components/schemas/ProblemStudioReviewCounts'}
        items: {type: array, items: {$ref: '#/components/schemas/ProblemStudioReviewItem'}}
    ProblemStudioReviewCounts:
      type: object
      required: [passed, reviewRequired, unverifiable, excluded]
      properties:
        passed: {type: integer, minimum: 0}
        reviewRequired: {type: integer, minimum: 0}
        unverifiable: {type: integer, minimum: 0}
        excluded: {type: integer, minimum: 0}
    ProblemStudioReviewItem:
      type: object
      required: [itemId, ordinal, stem, options, validationStatus, selected]
      properties:
        itemId: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 1}
        externalItemId: {type: string, nullable: true}
        stem: {type: string}
        passage: {type: string, nullable: true}
        options: {type: array, minItems: 2, items: {$ref: '#/components/schemas/ProblemStudioOption'}}
        correctAnswerText: {type: string, nullable: true}
        explanation: {type: string, nullable: true}
        sourceBasis: {type: string, nullable: true}
        validationStatus: {$ref: '#/components/schemas/ProblemValidationStatus'}
        validationMessage: {type: string, nullable: true}
        selected: {type: boolean}

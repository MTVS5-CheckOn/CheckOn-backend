        projectionStatus: {type: string, enum: [PENDING, PROJECTED, PARTIAL, UNSUPPORTED]}
        projectionErrorCode: {type: string, nullable: true}
        counts: {$ref: '#/components/schemas/ProblemStudioReviewCounts'}
        items: {type: array, items: {$ref: '#/components/schemas/ProblemStudioReviewItem'}}
        slots: {type: array, items: {$ref: '#/components/schemas/ProblemStudioReviewSlot'}}
    ProblemStudioReviewSlot:
      type: object
      required: [slotIndex, status, currentRevisionNo]
      properties:
        slotIndex: {type: integer, minimum: 0}
        itemId: {type: string, format: uuid, nullable: true}
        externalItemId: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/ProblemValidationStatus'}
        currentRevisionNo: {type: integer, minimum: 0}
        reviewReason: {type: string, nullable: true}
        failureReason: {type: string, nullable: true}
    ProblemStudioReviewCounts:
      type: object
      required: [passed, reviewRequired, unverifiable, excluded]
      properties:
        passed: {type: integer, minimum: 0}
        reviewRequired: {type: integer, minimum: 0}
        unverifiable: {type: integer, minimum: 0}
        excluded: {type: integer, minimum: 0}
    ProblemStudioReviewItem:
      type: object
      required: [itemId, ordinal, stem, options, validationStatus, selected]
      properties:
        itemId: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 1}
        externalItemId: {type: string, nullable: true}
        stem: {type: string}
        passage: {type: string, nullable: true}
        options: {type: array, minItems: 2, items: {$ref: '#/components/schemas/ProblemStudioOption'}}
        correctAnswerText: {type: string, nullable: true}
        explanation: {type: string, nullable: true}
        sourceBasis: {type: string, nullable: true}
        validationStatus: {$ref: '#/components/schemas/ProblemValidationStatus'}
        validationMessage: {type: string, nullable: true}
        selected: {type: boolean}
    ProblemStudioOption:
      type: object
      required: [position, content, correct]
      properties:
        position: {type: integer, minimum: 1}
        content: {type: string}
        correct: {type: boolean}
    ProblemStudioSelectionRequest:
      type: object
      additionalProperties: false
      required: [itemIds]
      properties:
        itemIds: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
    ProblemStudioSavedSet:
      type: object
      required: [problemSetId, itemCount, status, savedAt]
      properties:
        problemSetId: {type: string, format: uuid}
        itemCount: {type: integer, minimum: 1}
        status: {type: string, enum: [SAVED, PUBLISHED]}
        savedAt: {type: string, format: date-time}
    ProblemStudioAssignment:
      type: object
      required: [assignmentId, problemSetId, studentId, itemCount, status, publishedAt]
      properties:
        assignmentId: {type: string, format: uuid}
        problemSetId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        itemCount: {type: integer, minimum: 1}
        status: {type: string, enum: [PUBLISHED]}
        publishedAt: {type: string, format: date-time}
    ProblemStudioPrintable:
      type: object
      required: [requestId, studentId, studentName, generatedAt, items]
      properties:
        requestId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        studentName: {type: string}
        className: {type: string, nullable: true}
        subject: {type: string, nullable: true}
        generatedAt: {type: string, format: date-time}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ProblemStudioReviewItem'}}
    CounselTopic: {type: string, enum: [grade, schedule, counsel_request, etc], description: complaint는 topic이 아니다 — 별도 classify 축으로 옮겨졌다.}
    CounselUrgency: {type: string, enum: [immediate, normal], description: 인박스 정렬·SLA용. AI는 이 값으로 톤을 바꾸지 않는다.}
    CounselJobPhase: {type: string, enum: [queued, leased, running, paused, succeeded, failed, cancelled], description: '잡 phase 7종. draftStatus와는 다른 축이다.'}
    CounselDraftStatus: {type: string, enum: [generated, template_only, rejected_insufficient, llm_failed, gate_exhausted], description: 초안 판정 5종. template_only·rejected_insufficient는 정상 동작이며 에러가 아니다.}
    CounselBlockedReason: {type: string, nullable: true, enum: [evidence_missing, comparison_exposure, tone_violation, pii_exposure, out_of_scope, answer_integrity, banned_topic, prompt_injection]}
    CounselDismissedSuggestion:
      type: object
      required: [axis, value]
      properties: {axis: {type: string}, value: {type: string}}
    CounselFact:
      type: object
      required: [summary]
      properties:
        recordId: {type: string, nullable: true, description: 집계·기준선 파생 사실은 null이 정상이다. 가짜 id를 채우지 않는다.}
        summary: {type: string}
    CounselCreateDraftRequest:
      type: object
      required: [studentId, classId, inquiryRef, topic, urgency, receivedAt, text, periodLabel, facts]
      properties:
        studentId: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        inquiryRef: {type: string, maxLength: 200}
        topic: {$ref: '#/components/schemas/CounselTopic'}
        urgency: {$ref: '#/components/schemas/CounselUrgency'}
        receivedAt: {type: string, format: date-time}
        text: {type: string, description: 문의 원문. 백엔드가 실명·연락처를 마스킹한 뒤 AI로 보낸다.}
        labels: {type: array, items: {type: string}, description: '4축(comm·sensitivity·interest·frequency) 확정 라벨의 평탄한 배열. 선택.'}
        dismissedSuggestions: {type: array, items: {$ref: '#/components/schemas/CounselDismissedSuggestion'}}
        periodLabel: {type: string, maxLength: 120}
        facts: {type: array, items: {$ref: '#/components/schemas/CounselFact'}, description: 인용 가능한 학습 사실 목록. 비어 있으면 초안이 정직하게 거부된다(rejected_insufficient).}
    CounselCreateDraftResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId: {type: string}
        status: {$ref: '#/components/schemas/CounselJobPhase'}
    CounselCitation:
      type: object
      required: [citeId, recordId, summary]
      properties: {citeId: {type: string}, recordId: {type: string}, summary: {type: string}}
    CounselDraftResult:
      type: object
      required: [draftStatus, generatedAt]
      properties:
        draftStatus: {$ref: '#/components/schemas/CounselDraftStatus'}
        text: {type: string, nullable: true, description: generated일 때만 값이 있다.}
        citations:
          type: array
          items: {$ref: '#/components/schemas/CounselCitation'}
          description: 각주가 아니라 참고 목록이다 — 본문 문장과의 대응이 없다.
        labelsApplied: {type: array, items: {type: string}}
        statusReason: {type: string, nullable: true, description: '14종 + unmapped: 접두. enum이 아니라 문자열이라 앞으로 늘어날 수 있다 — 모르는 값은 draftStatus 기본 문구로 처리한다.'}
        generatedAt: {type: string, format: date-time}
    CounselGetDraftResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId: {type: string}
        status: {$ref: '#/components/schemas/CounselJobPhase'}
        result:
          type: object
          nullable: true
          allOf: [{$ref: '#/components/schemas/CounselDraftResult'}]
          description: 잡이 아직 안 끝났으면 null. status=succeeded여도 draftStatus=rejected_insufficient인 정상 조합이 있다.
    CounselRefineRequest:
      type: object
      required: [instruction]
      properties:
        instruction: {type: string, description: 강사의 자유 지시문 1턴. 게이트를 이기지 못하면 차단된다.}
        turnNo: {type: integer, minimum: 1, default: 1}
    CounselRefineResponse:
      type: object
      required: [applied]
      properties:
        applied: {type: boolean, description: '차단도 200으로 온다 — 이 값으로 분기한다.'}
        text: {type: string, nullable: true, description: applied=true일 때만 값이 있다.}
        citations: {type: array, items: {$ref: '#/components/schemas/CounselCitation'}}
        blockedReason: {$ref: '#/components/schemas/CounselBlockedReason'}
    CounselMarkSentRequest:
      type: object
      required: [text]
      properties: {text: {type: string, description: 강사가 실제로 발송한 본문.}}
    InquirySentiment: {type: string, enum: [normal, complaint], description: '"무엇에 대한 문의인가"(topic)와 별개인 "어떤 감정으로 썼는가" 축. classify만 준다.'}
    ClassifyFallbackReason: {type: string, enum: [parse_exhausted, tripwire_blocked], description: 닫힌 enum 2종 — counsel의 열린 status_reason과 다르다.}
    ConfirmationAction: {type: string, enum: [confirmed, corrected], description: v1은 이 2종만 지원한다. rejected를 보내면 400이다.}
    ClassifyInquiryRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, description: 문의 원문. counsel과 달리 마스킹하지 않고 그대로 보낸다 — AI가 자체 redaction을 거친다.}
    ClassifyResultResponse:
      type: object
      required: [topic, sentiment, urgency, confidenceTopic, confidenceSentiment, confidenceUrgency, classified]
      properties:
        topic: {$ref: '#/components/schemas/CounselTopic'}
        sentiment: {$ref: '#/components/schemas/InquirySentiment'}
        urgency: {$ref: '#/components/schemas/CounselUrgency'}
        confidenceTopic: {type: number, format: float, minimum: 0, maximum: 1}
        confidenceSentiment: {type: number, format: float, minimum: 0, maximum: 1}
        confidenceUrgency: {type: number, format: float, minimum: 0, maximum: 1}
        classified: {type: boolean, description: 'false면 topic·sentiment·urgency는 고정 폴백 값(topic=etc 등)이지 실제 판정이 아니다.'}
        fallbackReason:
          type: string
          nullable: true
          allOf: [{$ref: '#/components/schemas/ClassifyFallbackReason'}]
          description: classified=false일 때만 값이 있다.
    ConfirmClassificationRequest:
      type: object
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/ConfirmationAction'}
        correctedTopic: {type: string, allOf: [{$ref: '#/components/schemas/CounselTopic'}], nullable: true, description: action=corrected일 때만 보낸다. 부분 정정 가능 — 3축 중 바뀐 것만 채운다.}
        correctedSentiment: {type: string, allOf: [{$ref: '#/components/schemas/InquirySentiment'}], nullable: true}
        correctedUrgency: {type: string, allOf: [{$ref: '#/components/schemas/CounselUrgency'}], nullable: true}
    ErrorResponse:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}}

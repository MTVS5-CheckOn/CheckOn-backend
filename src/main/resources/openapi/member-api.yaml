      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/CursorPage'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/parents/me/notifications/{notificationId}/read:
    post:
      tags: [member-parent]
      summary: 알림 읽음 처리
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 처리됨 }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/parents/me/notifications/read-all:
    post:
      tags: [member-parent]
      summary: 전체 읽음 처리
      responses:
        '204': { description: 처리됨 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/parents/me/profile:
    get:
      tags: [member-parent]
      summary: 학부모 내 정보
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ParentProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/parents/me/profile/notification-preference:
    patch:
      tags: [member-parent]
      summary: 알림 설정 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: 변경됨 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/parents/me/invitations/verification:
    post:
      tags: [member-parent]
      summary: 강사 초대코드 검증
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: 유효
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InviteVerification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/parents/me/invitations:
    post:
      tags: [member-parent]
      summary: 강사 초대 등록
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: |
            🔴 **이미 같은 강사와 연결돼 있다** (MB-04 멱등). 새 관계를 만들지 않고 기존 연결을 반환한다.
            내가 같은 코드를 다시 제출한 경우도 여기다. 클라이언트는 오류로 보지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TeacherSummary' }
        '201':
          description: 관계 생성됨
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TeacherSummary' }
        '409':
          description: '`INVITE_ALREADY_CLAIMED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410': { $ref: '#/components/responses/Gone' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 기존 `POST /api/v1/auth/login` 이 발급한 access token.

  headers:
    XRequestId:
      description: 요청 추적 ID. 클라이언트가 보내지 않으면 서버가 생성한다.
      schema: { type: string }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 🔴 필수. 같은 key + 다른 body 는 409 IDEMPOTENCY_CONFLICT.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: 이전 응답의 `nextCursor`. 첫 페이지는 생략한다.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      description: 🔴 최대값 초과는 조용히 깎지 않고 400 으로 거절한다.
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeacherIdFilter:
      name: teacherId
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: |
        🔴 권한이 아니라 **필터**다. 서버가 parent↔teacher 와 student↔teacher 관계 교집합을
        매 요청 재검증한다. 생략하면 활성 강사 전체를 합산한다.

  responses:
    InvalidRequest:
      description: '400 `INVALID_REQUEST`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: '401 `AUTHENTICATION_REQUIRED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RoleForbidden:
      description: '403 `ROLE_FORBIDDEN`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    StudentActivationRequired:
      description: '403 `STUDENT_ACTIVATION_REQUIRED` — 학부모 연결 대기 중'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: '404 `RESOURCE_NOT_FOUND` — 🔴 권한 없음과 실제 부재를 구분하지 않는다'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: '409'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: '410 `INVITE_EXPIRED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RelationshipRequired:
      description: '422 `RELATIONSHIP_REQUIRED`'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: |
        403. `code` 로 분기한다.
        - `ROLE_FORBIDDEN` — 학생 앱이 학부모 API를 부르는 등 역할 불일치. 잘못된 앱 안내.
        - `STUDENT_ACTIVATION_REQUIRED` — 학부모 연결 대기 중인 학생. 활성화 대기 화면.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InternalError:
      description: |
        500 `INTERNAL`. 🔴 `message` 에 예외 내용·스택·쿼리를 담지 않는다.
        클라이언트는 자동 재시도하지 않고 `X-Request-Id` 를 노출해 문의를 유도한다.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DependencyUnavailable:
      description: |
        503 `DEPENDENCY_UNAVAILABLE` / 504 `DEPENDENCY_TIMEOUT`.
        조회 캐시를 유지하고 재시도 버튼을 준다. 🔴 자동 무한 재시도 금지.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: '429 `RATE_LIMITED`'
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    # ── 공통 ──
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/MemberErrorCode' }
            message: { type: string }
            details:
              description: 필드 위반 목록 등. 구조는 code 마다 다르다.
              nullable: true

    MemberErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - AUTHENTICATION_REQUIRED
        - INVALID_CREDENTIALS
        - ACCOUNT_NOT_ACTIVE
        - ROLE_FORBIDDEN
        - STUDENT_ACTIVATION_REQUIRED
        - RESOURCE_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - IDEMPOTENCY_CONFLICT
        - REVISION_CONFLICT
        - CHILD_ALREADY_LINKED
        - ATTEMPT_ALREADY_SUBMITTED
        - INVITE_ALREADY_CLAIMED
        - INVITE_EXPIRED
        - SUBMISSION_INCOMPLETE
        - RELATIONSHIP_REQUIRED
        - WORKSHEET_NOT_GRADABLE
        - RATE_LIMITED
        - DEPENDENCY_UNAVAILABLE
        - DEPENDENCY_TIMEOUT
        - INTERNAL

    CursorPage:
      type: object
      required: [items, hasNext]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: string, nullable: true }
        hasNext: { type: boolean }

    ValueStatus:
      type: string
      description: 🔴 0 과 결측을 구분하기 위해 값과 함께 항상 내려간다.
      enum: [AVAILABLE, INSUFFICIENT, NO_DATA, NOT_PRODUCED]

    AreaTag:
      type: string
      description: CheckOn-AI `contracts/taxonomy.py:36-51` 와 동일. 구버전 6영역은 사용하지 않는다.
      enum: [language, media, literature, reading, speech_writing]

    TypeTag:
      type: string
      description: CheckOn-AI `contracts/taxonomy.py`. v1 은 `apply` 를 생산하지 않는다.
      enum: [fact, infer, critic, concept, apply]

    TeacherSummary:
      type: object
      description: |
        🔴 `academyName` 은 백엔드 어디에도 원본이 없어서 필드 자체를 두지 않는다
        (`teacher_profiles` 는 `display_name` 뿐 — V4:54-74). 지어내지 않는다.
      required: [teacherId, displayName]
      properties:
        teacherId: { type: string, format: uuid }
        displayName: { type: string }
        subject:
          type: string
          nullable: true
          description: |
            원본은 `class_groups.subject`(V13) 뿐이고 학생·학부모는 `class_groups` 에
            SELECT 정책이 없다. 현재는 항상 `null` 이다.

    # ── auth ──
    StudentSignUpRequest:
      type: object
      required: [email, password, name, grade, termsAgreed]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100 }
        grade: { type: integer, minimum: 1, maximum: 3 }
        termsAgreed: { type: boolean }
        marketingAgreed: { type: boolean, default: false }

    ParentSignUpRequest:
      type: object
      required: [email, password, name, termsAgreed]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100 }
        termsAgreed: { type: boolean }
        marketingAgreed: { type: boolean, default: false }

    SignUpResult:
      type: object
      required: [accountId, role]
      properties:
        accountId: { type: string, format: uuid }
        role: { type: string, enum: [STUDENT, PARENT] }
        studentPublicId:
          type: string
          nullable: true
          description: 학생 가입일 때만. 학부모에게 알려줄 코드.
        activationStatus:
          allOf: [{ $ref: '#/components/schemas/StudentActivationStatus' }]
          nullable: true

    StudentActivationStatus:
      type: string
      enum: [PENDING_PARENT_LINK, ACTIVE, DEACTIVATED]

    StudentActivation:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/StudentActivationStatus' }
        studentPublicId: { type: string }
        activatedAt: { type: string, format: date-time, nullable: true }

    StudentLoginRequest:
      type: object
      required: [studentPublicId, password]
      properties:
        studentPublicId:
          type: string
          description: |
            `STU-B52D9K` 형식. 🔴 서버가 정규화한다 — 앞뒤 공백 제거 → 대문자화 →
            `STU` 접두 뒤 하이픈 1개. `stu b52d9k` · `STUB52D9K` 도 같은 값으로 해석한다.
        password: { type: string, minLength: 8, maxLength: 200 }

    MemberAuthResult:
      type: object
      description: 기존 `POST /api/v1/auth/login` 의 `data` 와 **같은 모양**이다. 프론트가 한 어댑터로 처리한다.
      required: [accessToken, accessTokenExpiresAt, account]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        account:
          type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            role: { type: string, enum: [STUDENT, PARENT] }
            email: { type: string, format: email }
            teacherProfileId:
              type: string
              nullable: true
              description: 학생·학부모는 항상 `null`.

    MemberSession:
      type: object
      required: [accountId, role, name]
      properties:
        accountId: { type: string, format: uuid }
        role: { type: string, enum: [STUDENT, PARENT] }
        name: { type: string }
        studentProfileId: { type: string, format: uuid, nullable: true }
        parentProfileId: { type: string, format: uuid, nullable: true }
        activationStatus:
          allOf: [{ $ref: '#/components/schemas/StudentActivationStatus' }]
          nullable: true
        studentPublicId: { type: string, nullable: true }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/TeacherSummary' }
        notificationsEnabled: { type: boolean }

    # ── student ──
    StudentHome:
      type: object
      required: [studentName, todayWorksheets]
      properties:
        studentName: { type: string }
        continuing:
          allOf: [{ $ref: '#/components/schemas/WorksheetSummary' }]
          nullable: true
          description: 진행 중 attempt 가 있는 학습지. 없으면 null.
        todayWorksheets:
          type: array
          items: { $ref: '#/components/schemas/WorksheetSummary' }
        weakness:
          type: object
          nullable: true
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/ValueStatus' }
            areaTag:
              allOf: [{ $ref: '#/components/schemas/AreaTag' }]
              nullable: true
            typeTag:
              allOf: [{ $ref: '#/components/schemas/TypeTag' }]
              nullable: true
            accuracyRate: { type: number, format: double, nullable: true }

    WorksheetSummary:
      type: object
      required: [assignmentId, title, itemCount, status, teacher]
      properties:
        assignmentId: { type: string, format: uuid }
        title: { type: string }
        areaTag:
          allOf: [{ $ref: '#/components/schemas/AreaTag' }]
          nullable: true
        itemCount: { type: integer }
        estimatedMinutes: { type: integer, nullable: true }
        status: { type: string, enum: [NEW, IN_PROGRESS, COMPLETED] }
        publishedAt: { type: string, format: date-time }
        teacher: { $ref: '#/components/schemas/TeacherSummary' }
        latestAttemptId: { type: string, format: uuid, nullable: true }
        accuracyRate:
          type: number
          format: double
          nullable: true
          description: COMPLETED 일 때만. 0~1.

    WorksheetDetail:
      allOf:
        - $ref: '#/components/schemas/WorksheetSummary'
        - type: object
          properties:
            description: { type: string, nullable: true }
            itemBreakdown:
              type: array
              items:
                type: object
                required: [areaTag, typeTag, count]
                properties:
                  areaTag: { $ref: '#/components/schemas/AreaTag' }
                  typeTag: { $ref: '#/components/schemas/TypeTag' }
                  count: { type: integer }

    AttemptInProgress:
      type: object
      description: |
        🔴 이 스키마에는 `correctAnswer`·`explanation`·`correct` 가 **존재하지 않는다**.
        서버는 별도 record 로 직렬화하며, 계약 테스트가 해당 키의 부재를 단언한다.
      required: [attemptId, assignmentId, status, version, items, answers, activeElapsedSecondsByItem]
      properties:
        attemptId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        status: { type: string, enum: [IN_PROGRESS] }
        version: { type: integer, description: optimistic lock. progress 요청의 baseVersion 에 넣는다. }
        snapshotHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        startedAt: { type: string, format: date-time }
        currentItemId: { type: string, format: uuid, nullable: true }
        totalActiveElapsedSeconds: { type: integer }
        answers:
          type: object
          additionalProperties: { type: integer }
          description: 'itemId → 선택한 보기 번호(1-based)'
        activeElapsedSecondsByItem:
          type: object
          additionalProperties: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AttemptItem' }

    AttemptItem:
      type: object
      required: [itemId, ordinal, stem, options]
      properties:
        itemId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        stem: { type: string }
        passage: { type: string, nullable: true }
        areaTag:
          allOf: [{ $ref: '#/components/schemas/AreaTag' }]
          nullable: true
        typeTag:
          allOf: [{ $ref: '#/components/schemas/TypeTag' }]
          nullable: true
        options:
          type: array
          items:
            type: object
            required: [no, text]
            properties:
              no: { type: integer, minimum: 1 }
              text: { type: string }

    AttemptProgressRequest:
      type: object
      required: [baseVersion, clientSequence]
      properties:
        baseVersion: { type: integer }
        clientSequence:
          type: integer
          description: 클라이언트 단조 증가 시퀀스. 같은 값 재전송은 멱등 처리된다.
        currentItemId: { type: string, format: uuid, nullable: true }
        answers:
          type: object
          additionalProperties: { type: integer }
          description: 변경된 항목만 보낸다.
        activeElapsedSecondsDelta:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 600 }
          description: 🔴 음수 금지. 단일 요청 항목당 상한 600초. 초과는 400.

    AttemptProgressResult:
      type: object
      required: [attemptId, version, totalActiveElapsedSeconds]
      properties:
        attemptId: { type: string, format: uuid }
        version: { type: integer }
        totalActiveElapsedSeconds: { type: integer }
        savedAt: { type: string, format: date-time }
        duplicated:
          type: boolean
          description: 같은 clientSequence 재전송이라 무시했으면 true.

    AttemptSubmitRequest:
      type: object
      required: [baseVersion]
      properties:
        baseVersion: { type: integer }
        answers:
          type: object
          additionalProperties: { type: integer }
          description: 마지막 답안 전량. 생략하면 저장된 답안으로 채점한다.
        activeElapsedSecondsDelta:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 600 }

    AttemptResult:
      type: object
      required: [attemptId, assignmentId, status, itemCount, correctCount, accuracyRate, items]
      properties:
        attemptId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        status: { type: string, enum: [SCORED] }
        submittedAt: { type: string, format: date-time }
        scoredAt: { type: string, format: date-time }
        itemCount: { type: integer }
        correctCount: { type: integer }
        accuracyRate: { type: number, format: double, description: '0~1' }
        totalActiveElapsedSeconds: { type: integer }
        learningRecordId: { type: string, format: uuid, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/AttemptItemResult' }

    AttemptItemResult:
      allOf:
        - $ref: '#/components/schemas/AttemptItem'
        - type: object
          required: [selectedNo, correctNo, correct, explanation]
          properties:
            selectedNo: { type: integer, nullable: true, description: 미응답이면 null }
            correctNo: { type: integer }
            correct: { type: boolean }
            explanation:
              type: string
              description: 🔴 정답 문항도 포함한다. 접힌 해설을 열 수 있어야 한다.
            activeElapsedSeconds: { type: integer }

    LearningRecordSummary:
      type: object
      required: [recordId, title, occurredAt, itemCount, correctCount, accuracyRate]
      properties:
        recordId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid, nullable: true }
        attemptId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        occurredAt: { type: string, format: date-time }
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        areaTag:
          allOf: [{ $ref: '#/components/schemas/AreaTag' }]
          nullable: true
        itemCount: { type: integer }
        correctCount: { type: integer }
        accuracyRate: { type: number, format: double }
        totalActiveElapsedSeconds: { type: integer }
        teacher: { $ref: '#/components/schemas/TeacherSummary' }

    LearningRecordDetail:
      allOf:
        - $ref: '#/components/schemas/LearningRecordSummary'
        - type: object
          required: [items, weakness]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AttemptItemResult' }
            weakness:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ValueStatus' }
                areaTag:
                  allOf: [{ $ref: '#/components/schemas/AreaTag' }]
                  nullable: true
                typeTag:
                  allOf: [{ $ref: '#/components/schemas/TypeTag' }]
                  nullable: true
                description: { type: string, nullable: true }
            trend:
              type: array
              description: 🔴 실제 집계 결과만. 값이 없으면 빈 배열이고 지어내지 않는다.
              items:
                type: object
                required: [month, accuracyRate, status]
                properties:
                  month: { type: string, pattern: '^\d{4}-\d{2}$' }
                  accuracyRate: { type: number, format: double, nullable: true }
                  status: { $ref: '#/components/schemas/ValueStatus' }

    StudentQuestion:
      type: object
      required: [questionId, status, title, createdAt]
      properties:
        questionId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        itemId: { type: string, format: uuid, nullable: true }
        itemOrdinal: { type: integer, nullable: true }
        worksheetTitle: { type: string }
        title: { type: string }
        status: { type: string, enum: [WAITING, ANSWERED, FOLLOW_UP] }
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
        teacher: { $ref: '#/components/schemas/TeacherSummary' }

    StudentQuestionDetail:
      allOf:
        - $ref: '#/components/schemas/StudentQuestion'
        - type: object
          required: [content, messages]
          properties:
            content: { type: string }
            messages:
              type: array
              items: { $ref: '#/components/schemas/QuestionMessage' }

    QuestionMessage:
      type: object
      required: [messageId, authorRole, content, publishedAt]
      properties:
        messageId: { type: string, format: uuid }
        authorRole: { type: string, enum: [STUDENT, TEACHER] }
        content: { type: string }
        publishedAt: { type: string, format: date-time }

    CreateQuestionRequest:
      type: object
      required: [assignmentId, title, content]
      properties:
        assignmentId: { type: string, format: uuid }
        itemId: { type: string, format: uuid, nullable: true }
        attemptId: { type: string, format: uuid, nullable: true }
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 2000 }

    StudentProfile:
      type: object
      required: [studentId, studentPublicId, name, grade, activationStatus, teachers, notificationsEnabled]
      properties:
        studentId: { type: string, format: uuid }
        studentPublicId: { type: string }
        name: { type: string }
        grade: { type: integer }
        activationStatus: { $ref: '#/components/schemas/StudentActivationStatus' }
        parentLinked: { type: boolean }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/TeacherSummary' }
        notificationsEnabled: { type: boolean }

    InviteVerification:
      type: object
      required: [valid, teacher]
      properties:
        valid: { type: boolean }
        teacher: { $ref: '#/components/schemas/TeacherSummary' }
        expiresAt: { type: string, format: date-time }

    # ── parent ──
    Child:
      type: object
      required: [studentId, studentPublicId, name, activationStatus]
      properties:
        studentId: { type: string, format: uuid }
        studentPublicId: { type: string }
        name: { type: string }
        grade: { type: integer, nullable: true }
        activationStatus: { $ref: '#/components/schemas/StudentActivationStatus' }
        linkedAt: { type: string, format: date-time }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/TeacherSummary' }

    ChildVerification:
      type: object
      required: [registrable]
      properties:
        registrable: { type: boolean }
        name:
          type: string
          nullable: true
          description: 🔴 부분 마스킹된 이름만 반환한다 (예 `김*수`).
        grade: { type: integer, nullable: true }
        reason:
          type: string
          nullable: true
          enum: [ALREADY_LINKED, NOT_FOUND, null]

    ChildRegistrationResult:
      type: object
      required: [child]
      properties:
        child: { $ref: '#/components/schemas/Child' }

    ParentHome:
      type: object
      required: [child, metrics]
      properties:
        child: { $ref: '#/components/schemas/Child' }
        metrics:
          type: array
          items:
            type: object
            required: [key, status]
            properties:
              key: { type: string, enum: [MONTHLY_ACCURACY, SOLVED_COUNT, AVERAGE_DURATION_SEC, WEAKNESS_DELTA_PP] }
              status: { $ref: '#/components/schemas/ValueStatus' }
              value: { type: number, format: double, nullable: true }
              unit: { type: string, nullable: true, enum: [RATIO, COUNT, SECONDS, PERCENTAGE_POINT, null] }
        latestReport:
          allOf: [{ $ref: '#/components/schemas/ReportSummary' }]
          nullable: true
        recentRecords:
          type: array
          items: { $ref: '#/components/schemas/LearningRecordSummary' }

    ParentAnalysis:
      type: object
      required: [month, overall, weaknessRanking]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        calculationVersion: { type: string }
        calculatedAt: { type: string, format: date-time }
        overall:
          type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/ValueStatus' }
            accuracyRate: { type: number, format: double, nullable: true }
            scoredCount: { type: integer, nullable: true }
            averageActiveSeconds: { type: integer, nullable: true }
        accuracyTrend:
          type: array
          items:
            type: object
            required: [month, status]
            properties:
              month: { type: string }
              accuracyRate: { type: number, format: double, nullable: true }
              status: { $ref: '#/components/schemas/ValueStatus' }
        areaScores:
          type: array
          items:
            type: object
            required: [areaTag, status]
            properties:
              areaTag: { $ref: '#/components/schemas/AreaTag' }
              accuracyRate: { type: number, format: double, nullable: true }
              scoredCount: { type: integer }
              status: { $ref: '#/components/schemas/ValueStatus' }
        weaknessRanking:
          type: array
          items: { $ref: '#/components/schemas/WeaknessCell' }
        primaryWeakness:
          allOf: [{ $ref: '#/components/schemas/WeaknessCell' }]
          nullable: true

    WeaknessCell:
      type: object
      required: [areaTag, typeTag, status]
      properties:
        areaTag: { $ref: '#/components/schemas/AreaTag' }
        typeTag: { $ref: '#/components/schemas/TypeTag' }
        status: { $ref: '#/components/schemas/ValueStatus' }
        scoredCount: { type: integer }
        correctCount: { type: integer }
        accuracyRate: { type: number, format: double, nullable: true }
        improvement:
          type: object
          description: 🔴 같은 셀의 전월 대비. 다른 셀끼리 비교하지 않는다.
          required: [status]
          properties:
            status:
              type: string
              enum: [AVAILABLE, NO_PREVIOUS_PERIOD, INSUFFICIENT_SAMPLE, NO_DATA]
            previousAccuracyRate: { type: number, format: double, nullable: true }
            accuracyDeltaPp:
              type: number
              format: double
              nullable: true
              description: 퍼센트포인트. 43%→51% 는 8.0.
            minimumSampleSize: { type: integer, description: 판정에 쓴 최소 표본 수 }

    WeaknessDetail:
      allOf:
        - $ref: '#/components/schemas/WeaknessCell'
        - type: object
          properties:
            recentItems:
              type: array
              description: 🔴 상한으로 잘랐다면 truncated 로 밝힌다.
              items:
                type: object
                required: [itemId, correct, occurredAt]
                properties:
                  itemId: { type: string, format: uuid }
                  recordId: { type: string, format: uuid }
                  stem: { type: string }
                  correct: { type: boolean }
                  activeElapsedSeconds: { type: integer }
                  occurredAt: { type: string, format: date-time }
            truncated:
              type: object
              required: [applied]
              properties:
                applied: { type: boolean }
                limit: { type: integer, nullable: true }
                orderedBy: { type: string, nullable: true, description: 무엇을 기준으로 잘랐는지 }

    ReportSummary:
      type: object
      required: [reportId, reportMonth, status, publishedAt, teacher]
      properties:
        reportId: { type: string, format: uuid }
        reportMonth: { type: string, pattern: '^\d{4}-\d{2}$' }
        revision: { type: integer }
        status: { type: string, enum: [PUBLISHED], description: 🔴 학부모에게는 PUBLISHED 만 노출된다 }
        publishedAt: { type: string, format: date-time }
        teacher: { $ref: '#/components/schemas/TeacherSummary' }
        hasPdf: { type: boolean }

    ReportDetail:
      allOf:
        - $ref: '#/components/schemas/ReportSummary'
        - type: object
          required: [sections]
          properties:
            snapshotVersion: { type: string }
            sections:
              type: array
              items:
                type: object
                required: [kind, status]
                properties:
                  kind: { type: string }
                  title: { type: string }
                  status: { $ref: '#/components/schemas/ValueStatus' }
                  body: { type: string, nullable: true }
                  data:
                    nullable: true
                    description: 차트용 원시 값. 표시 스냅샷이라 발행 후 불변.
                  evidenceRefs:
                    type: array
                    items: { type: string }
                  unproducedReason:
                    type: string
                    nullable: true
                    description: |
                      status 가 NOT_PRODUCED 일 때의 사유.
                      전국 백분위는 항상 여기에 해당한다.

    ReportFileAccess:
      type: object
      required: [url, expiresAt, contentType]
      properties:
        url: { type: string, format: uri, description: 🔴 수명이 짧은 signed URL. object key 아님. }
        expiresAt: { type: string, format: date-time }
        contentType: { type: string, enum: ['application/pdf'] }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        sizeBytes: { type: integer }
        pageCount: { type: integer, nullable: true }

    CreateConsultationRequest:
      type: object
      required: [studentId, teacherId, content]
      properties:
        studentId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 🔴 학부모가 주제를 고르지 않는다. 분류는 서버·AI 보조가 한다.
        context:
          type: object
          nullable: true
          required: [type, id]
          properties:
            type: { type: string, enum: [RECORD, ANALYSIS, REPORT] }
            id: { type: string, format: uuid }

    Consultation:
      type: object
      required: [consultationId, studentId, teacherId, status, createdAt]
      properties:
        consultationId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        childName: { type: string }
        teacherName: { type: string }
        status: { type: string, enum: [SUBMITTED, REVIEWING, ANSWERED, CLOSED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
        aiAssistance:
          type: string
          description: |
            🔴 AI 보조 상태. 사용자 흐름과 무관하며 실패해도 상담은 성공이다.
            `UNAVAILABLE` 이면 강사가 수동 답변한다.
          enum: [NOT_REQUESTED, PENDING, READY, TEMPLATE_ONLY, REJECTED_INSUFFICIENT, UNAVAILABLE]

    ConsultationDetail:
      allOf:
        - $ref: '#/components/schemas/Consultation'
        - type: object
          required: [content, messages]
          properties:
            content: { type: string, description: 학부모 원문 }
            messages:
              type: array
              description: 🔴 강사가 승인·발행한 메시지만. AI raw 초안은 포함되지 않는다.
              items:
                type: object
                required: [messageId, authorRole, content, publishedAt]
                properties:
                  messageId: { type: string, format: uuid }
                  authorRole: { type: string, enum: [PARENT, TEACHER] }
                  content: { type: string }
                  publishedAt: { type: string, format: date-time }

    Notification:
      type: object
      required: [notificationId, type, title, createdAt, read]
      properties:
        notificationId: { type: string, format: uuid }
        type: { type: string, enum: [REPORT_PUBLISHED, CONSULTATION_ANSWERED, QUESTION_ANSWERED, LEARNING_SUBMITTED, CHILD_LINKED] }
        title: { type: string }
        body: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        target:
          type: object
          nullable: true
          properties:
            studentId: { type: string, format: uuid, nullable: true }
            resourceId: { type: string, format: uuid, nullable: true }

    ParentProfile:
      type: object
      required: [parentId, name, children, teachers, notificationsEnabled]
      properties:
        parentId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        children:
          type: array
          items: { $ref: '#/components/schemas/Child' }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/TeacherSummary' }
        notificationsEnabled: { type: boolean }

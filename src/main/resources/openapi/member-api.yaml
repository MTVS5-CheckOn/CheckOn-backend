openapi: 3.0.3
info:
  title: CheckOn Member API (학생·학부모)
  version: 0.1.0-draft
  description: |
    학생·학부모 앱 전용 API. `com.checkon.member` 패키지가 소유한다.

    ## 규약
    - 성공 body: `{ "data": <payload> }`
    - 오류 body: `{ "error": { "code", "message", "details"? } }`
    - 모든 응답에 `X-Request-Id` 헤더
    - JSON key는 camelCase
    - 시각은 RFC 3339 UTC instant, 월은 `YYYY-MM`
    - 비율은 0~1 (`accuracyRate`), 변화량은 퍼센트포인트 (`accuracyDeltaPp`)
    - 목록은 cursor pagination (`cursor`, `limit`) → `{ items, nextCursor, hasNext }`
    - 생성/제출/관계등록/상담/초대에는 `Idempotency-Key` 필수

    ## 인증 (MB-01 CONFIRMED)
    - **학생**: `POST /api/v1/member/auth/students/login` — 공개 학생 ID + 비밀번호
    - **학부모**: `POST /api/v1/auth/login` — 이메일 + 비밀번호 (기존 API 그대로)
    - **refresh / logout**: 둘 다 기존 `POST /api/v1/auth/refresh` · `/logout` 를 쓴다.
      member 는 만들지 않는다. 학생 로그인이 발급하는 쿠키의 Path 를 `/api/v1/auth` 로 맞췄기 때문이다.

    ## 미확정
    `x-checkon-open` 확장이 붙은 필드/동작은 팀 확정 전이다. 설계 정본 §17 참조.

servers:
  - url: /api/v1
    description: 기존 백엔드와 동일한 base

tags:
  - name: member-auth
    description: 학생·학부모 가입과 세션 부트스트랩
  - name: member-student
    description: 학생 앱
  - name: member-parent
    description: 학부모 앱

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────── auth ───────────────────────────────
  /member/auth/students/sign-up:
    post:
      tags: [member-auth]
      summary: 학생 가입
      description: |
        account(role=STUDENT) + student_profiles + 공개 학생 ID + 활성화 레코드를 한 트랜잭션에 만든다.
        생성 직후 `activationStatus`는 항상 `PENDING_PARENT_LINK`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentSignUpRequest' }
      responses:
        '201':
          description: 생성됨
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SignUpResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/auth/parents/sign-up:
    post:
      tags: [member-auth]
      summary: 학부모 가입
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentSignUpRequest' }
      responses:
        '201':
          description: 생성됨
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SignUpResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/auth/students/login:
    post:
      tags: [member-auth]
      summary: 학생 로그인 (공개 학생 ID + 비밀번호)
      description: |
        🔴 학생은 **공개 학생 ID**(`STU-B52D9K`)로 로그인한다 — MB-01 CONFIRMED.
        학부모는 이 엔드포인트를 쓰지 않고 기존 `POST /api/v1/auth/login`(이메일)을 쓴다.

        서버 처리:
        ```
        공개 ID 정규화 → member_student_public_ids 조회 → student_profiles.account_id
        → accounts.email → 기존 LoginService.login(email, password) 호출
        → CHECKON_REFRESH 쿠키를 Path=/api/v1/auth 로 발급
        ```
        🔴 쿠키 Path 를 `/api/v1/auth` 로 **맞춰야** 기존 `POST /api/v1/auth/refresh` 가 그 쿠키를 읽는다.
        member 는 refresh·logout 을 만들지 않는다.

        🔴 공개 ID 가 없거나 계정이 연결되지 않았을 때도 **즉시 404 를 내지 않는다.**
        더미 해시로 BCrypt 시간을 태운 뒤 존재하는 경우와 **같은 `401 INVALID_CREDENTIALS`** 를 반환한다
        (기존 `LoginService` 의 dummy-hash 패턴과 같은 이유 — 공개 ID 열거 방지).
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentLoginRequest' }
      responses:
        '200':
          description: '로그인 성공. Set-Cookie 로 CHECKON_REFRESH 를 함께 내린다.'
          headers:
            Set-Cookie:
              description: 'HttpOnly refresh 쿠키. Path=/api/v1/auth'
              schema: { type: string }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MemberAuthResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: |
            `INVALID_CREDENTIALS` — 공개 ID 부재·비밀번호 불일치·계정 미연결을 **구분하지 않는다**.
            `ACCOUNT_NOT_ACTIVE` — 계정이 `SUSPENDED`/`WITHDRAWN`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/auth/session:
    get:
      tags: [member-auth]
      summary: 앱 bootstrap — 현재 계정·프로필·활성화 상태
      responses:
        '200':
          description: OK
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MemberSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/auth/students/activation-status:
    get:
      tags: [member-auth]
      summary: 학생 활성화 상태 (대기 화면 폴링용)
      description: |
        🔴 대기 학생이 호출할 수 있는 **3개 중 하나** (MB-02 CONFIRMED).
        나머지 둘은 `GET /member/auth/session` 과 기존 `POST /api/v1/auth/logout`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StudentActivation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoleForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ────────────────────────────── student ─────────────────────────────
  /member/students/me/home:
    get:
      tags: [member-student]
      summary: 학생 홈
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StudentHome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StudentActivationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/worksheets:
    get:
      tags: [member-student]
      summary: 배정 학습지 목록
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, IN_PROGRESS, COMPLETED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/CursorPage'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WorksheetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StudentActivationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/worksheets/{assignmentId}:
    get:
      tags: [member-student]
      summary: 학습지 상세 (문항 본문 없음)
      description: 🔴 문항 본문·정답·해설을 포함하지 않는다. 풀이는 attempt API로 시작한다.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorksheetDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/worksheets/{assignmentId}/attempts:
    post:
      tags: [member-student]
      summary: 풀이 시작 또는 재개
      description: |
        같은 학생·assignment 에 `IN_PROGRESS` attempt 가 있으면 **새로 만들지 않고** 기존 것을 반환한다.
        - 새로 만들었으면 `201`
        - 기존 것을 반환했으면 `200`
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 기존 attempt 재개
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttemptInProgress' }
        '201':
          description: 새 attempt 생성
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttemptInProgress' }
        '403': { $ref: '#/components/responses/StudentActivationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/attempts/{attemptId}:
    get:
      tags: [member-student]
      summary: attempt 조회 (복귀 시 상태 복원)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: |
            `status`가 `IN_PROGRESS`면 `AttemptInProgress`,
            `SCORED`면 `AttemptResult`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AttemptInProgress'
                      - $ref: '#/components/schemas/AttemptResult'
                    discriminator:
                      propertyName: status
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/attempts/{attemptId}/progress:
    patch:
      tags: [member-student]
      summary: 답안·풀이시간 자동 저장
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptProgressRequest' }
      responses:
        '200':
          description: 저장됨 (중복 clientSequence 재전송도 200)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttemptProgressResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `REVISION_CONFLICT` — baseVersion 불일치. 최신 attempt 재조회 후 병합.
            - `ATTEMPT_ALREADY_SUBMITTED` — 이미 제출됨. 결과 화면으로 이동.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/attempts/{attemptId}/submission:
    post:
      tags: [member-student]
      summary: 제출 + 서버 채점
      description: |
        한 트랜잭션에서 attempt row lock → 스냅샷 대조 → MCQ 결정론 채점 →
        `SUBMITTED` → `SCORED` 전이 → learning_records 기록 → 월 집계 outbox.
        동일 `Idempotency-Key` + 동일 body 재요청은 저장된 응답을 그대로 돌려준다.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptSubmitRequest' }
      responses:
        '200':
          description: 채점 완료
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttemptResult' }
        '409':
          description: '`IDEMPOTENCY_CONFLICT` | `ATTEMPT_ALREADY_SUBMITTED` | `REVISION_CONFLICT`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: '`SUBMISSION_INCOMPLETE` — 미응답 문항 금지 정책일 때만'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/attempts/{attemptId}/result:
    get:
      tags: [member-student]
      summary: 채점 결과 (정답·해설 포함)
      description: 🔴 채점 완료 후에만 정답·해설을 반환한다. 미제출 attempt는 404.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AttemptResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/learning-records:
    get:
      tags: [member-student]
      summary: 학습기록 목록
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/CursorPage'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/LearningRecordSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/learning-records/{recordId}:
    get:
      tags: [member-student]
      summary: 학습기록 상세
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LearningRecordDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/questions:
    get:
      tags: [member-student]
      summary: 질문 목록
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/CursorPage'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/StudentQuestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [member-student]
      summary: 문제 질문 작성
      description: 🔴 `teacherId`를 body로 받지 않는다. assignment 에서 서버가 결정한다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuestionRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StudentQuestion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RelationshipRequired' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/questions/{questionId}:
    get:
      tags: [member-student]
      summary: 질문 상세
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StudentQuestionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /member/students/me/questions/{questionId}/messages:
    post:
      tags: [member-student]
      summary: 추가 질문
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]

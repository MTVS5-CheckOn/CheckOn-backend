openapi: 3.0.3
info:
  title: CheckOn member-teacher API
  version: 0.1.0-draft
  description: |
    강사가 **학부모 상담에 답을 발행**하는 경계.

    🔴 **왜 별도 스펙 파일인가** — `dashboard-api.yaml` 은 승우님 파일이고 강사 프론트가
    그것으로 클라이언트를 생성한다(`checkon-front/openapi-ts.config.ts` 의 input).
    우리 변경이 그 파일에 섞이면 그분 작업과 충돌한다. 🔴 **강사 프론트는 스펙 입력을
    하나 더 추가하면 된다** — 기존 입력을 바꾸지 않는다.

    🔴 **경로가 `/api/v1/member/**` 밖이다.** 거기 두면 `MemberSecurityConfiguration`
    (`@Order(0)`, `securityMatcher("/api/v1/member/**")`) 이 가로채고 그 체인은 학생·학부모
    역할로 판정해 **강사가 401/403** 을 받는다. 여기는 그 matcher 밖이라
    `AccountSecurityConfiguration`(`@Order(2)`) 의 `/api/v1/** → hasRole("TEACHER")` 가 잡는다.

    🔴 **오류 봉투가 member 와 다르다.** member 는 `{"error":{code,message}}` 지만 이 경계는
    **top-level `{code, message}`** 다 — 이 경로의 401·403 을 Spring Security 단계의
    `SecurityErrorResponseWriter` 가 그 모양으로 쓰기 때문이다. 우리만 다르면 한 엔드포인트가
    실패 종류에 따라 두 가지 봉투를 낸다.
    🔴 다만 **오류 코드 어휘는 member 그대로** 쓴다(`docs/MEMBER_ERROR_CODES.md`).

    🔴 **dev 프로파일에서는 인증 없이도 열린다(MB-67).** 이 경로가 승우님 체인 위에 있어
    `DevelopmentTestAuthenticationFilter` 를 그대로 받는다 — Authorization 헤더가 없으면
    고정 강사 인증이 심어진다(실측: 인증 없는 `GET` 이 401 이 아니라 **200**).
    기본값은 꺼져 있고(`application.yaml`) `dev` 만 켜므로 운영 구멍은 아니지만,
    dev 서버를 외부에 노출하면 **상담 원문까지 보인다.**

    🔴 **AI 초안 조회 엔드포인트가 없다.** AI 초안 *본문* 을 담는 컬럼이 스키마에 없다
    (`member_consultations` 에는 `ai_status`·`ai_job_id` 뿐이고, 계약이
    「AI raw 초안은 저장하지 않는다」로 정했다). 없는 것을 돌려주는 엔드포인트를 만들면
    프론트가 있는 줄 안다.

servers:
  - url: /api/v1

tags:
  - name: member-teacher
    description: 강사 ↔ 학부모 상담 발행

paths:
  /member-consultations:
    get:
      tags: [member-teacher]
      operationId: listTeacherMemberConsultations
      summary: 내 상담 목록
      description: |
        🔴 **목록에는 학부모 원문이 없다.** 목록은 무엇에 답할지 고르는 화면이고 원문은
        상세에서 본다 — 응답이 로그·캐시·프록시에 남을 여지를 줄인다.
      parameters:
        - name: status
          in: query
          required: false
          description: 🔴 어휘 밖 값은 조용히 무시하지 않고 `400` 이다.
          schema:
            type: string
            enum: [SUBMITTED, REVIEWING, ANSWERED, CLOSED, CANCELLED]
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 🔴 최대값 초과는 조용히 깎지 않고 `400` 이다.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeacherConsultationSummary' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /member-consultations/{consultationId}:
    get:
      tags: [member-teacher]
      operationId: getTeacherMemberConsultation
      summary: 상담 상세 (학부모 원문 포함)
      description: |
        🔴 **남의 상담과 없는 상담을 모두 `404`** 로 낸다. 구분하면 존재 여부를 알려주는 셈이다.
        격리는 애플리케이션 WHERE 절이 아니라 V44 의 RLS 정책
        (`teacher_id = current_checkon_teacher_id()`)이 한다.
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherConsultationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /member-consultations/{consultationId}/answer:
    post:
      tags: [member-teacher]
      operationId: publishTeacherConsultationAnswer
      summary: 답변 발행
      description: |
        🔴 **발행이다.** 성공하면 그 순간 학부모에게 보인다 —
        `member_consultation_messages.published_at` 이 `NOT NULL` 이라
        「저장은 했는데 미발행」인 상태가 **물리적으로 존재하지 않는다.**

        🔴 **멱등은 상태로 본다.** 첫 답변이 `ANSWERED` 로 올리고, 두 번째 호출은 그 상태를
        보고 `409` 를 낸다 — 메시지는 한 벌뿐이다. `Idempotency-Key` 를 쓰지 않는 이유는
        키를 저장할 테이블이 없고(이 작업은 마이그레이션 0개) member 의 `IdempotencyGuard` 는
        경계 밖이기 때문이다.
        ⚠ 그래서 **네트워크 타임아웃 뒤 재시도한 클라이언트는 `201` 이 아니라 `409`** 를 받는다.
        「내 답이 갔는지」는 상세 조회로 확인한다.

        🔴 **알림을 보내지 않는다.** `member_notifications` 의 INSERT 정책이
        `current_checkon_account_id() IS NOT NULL` 을 요구하는데 강사 컨텍스트에서 그 값은
        `NULL` 이라 RLS 가 거절한다. 정책 없이 우회하지 않는다.
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerRequest' }
      responses:
        '201':
          description: 발행됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationAnswerResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            🔴 이미 답변됐거나(`ANSWERED`) 종료(`CLOSED`)·취소(`CANCELLED`)된 상담이다.
            **조용히 허용하지 않는다.** 코드는 `REVISION_CONFLICT` —
            member 어휘에 「이미 답변됨」 전용 코드가 없어 「상태가 이미 넘어갔다」를 쓴다.
            완벽한 대응은 아니며 전용 코드는 member 어휘를 늘려야 한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  parameters:
    ConsultationId:
      name: consultationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    InvalidRequest:
      description: '400 `INVALID_REQUEST`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: |
        401. 🔴 Spring Security 단계가 `{"code":"UNAUTHORIZED", ...}` 로 쓴다 —
        코드 값이 member 어휘가 아니라 보안 필터의 것이다.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: |
        403. 🔴 강사 역할이 아니다. 보안 필터가 `{"code":"FORBIDDEN", ...}` 로 쓴다.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: '404 `RESOURCE_NOT_FOUND` — 부재와 남의 상담을 구분하지 않는다'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        🔴 **top-level 봉투**다. member 의 `{"error":{...}}` 와 다르며, 그 이유는 이 경로의
        401·403 을 `SecurityErrorResponseWriter` 가 이 모양으로 쓰기 때문이다.
      properties:
        code:
          type: string
          description: |
            🔴 member 어휘 그대로(`docs/MEMBER_ERROR_CODES.md`).
            `UNAUTHORIZED`·`FORBIDDEN` 만 보안 필터가 쓰는 값이다.
          enum: [INVALID_REQUEST, RESOURCE_NOT_FOUND, REVISION_CONFLICT, INTERNAL,
                 UNAUTHORIZED, FORBIDDEN]
        message: { type: string }

    ConsultationStatus:
      type: string
      description: 🔴 V44 `ck_member_consultations_status` 의 다섯 개 그대로다.
      enum: [SUBMITTED, REVIEWING, ANSWERED, CLOSED, CANCELLED]

    TeacherConsultationSummary:
      type: object
      required: [consultationId, studentId, status, createdAt, answerable]
      properties:
        consultationId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConsultationStatus' }
        topic:
          type: string
          nullable: true
          enum: [grade, schedule, counsel_request, etc, null]
        urgency:
          type: string
          nullable: true
          enum: [immediate, normal, null]
        createdAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
        answerable:
          type: boolean
          description: |
            🔴 지금 답을 발행할 수 있는가. `SUBMITTED`·`REVIEWING` 이고 취소되지 않았을 때만
            `true` 다 — 화면이 버튼을 켜고 끄는 기준이고, 서버도 같은 판정을 다시 한다.

    TeacherConsultationMessage:
      type: object
      required: [messageId, authorRole, content, publishedAt]
      properties:
        messageId: { type: string, format: uuid }
        authorRole: { type: string, enum: [PARENT, TEACHER] }
        content: { type: string }
        publishedAt:
          type: string
          format: date-time
          description: 🔴 항상 값이 있다 — 미발행 메시지는 존재하지 않는다(`NOT NULL`).

    TeacherConsultationDetail:
      type: object
      required: [consultationId, studentId, parentId, status, content, createdAt,
                 updatedAt, answerable, messages]
      properties:
        consultationId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        parentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConsultationStatus' }
        aiAssistance:
          type: string
          nullable: true
          description: |
            🔴 **AI 초안 본문이 아니라 상태**다. 초안 본문은 저장하지 않는다.
          enum: [NOT_REQUESTED, PENDING, READY, TEMPLATE_ONLY, REJECTED_INSUFFICIENT,
                 UNAVAILABLE, null]
        topic:
          type: string
          nullable: true
          enum: [grade, schedule, counsel_request, etc, null]
        urgency:
          type: string
          nullable: true
          enum: [immediate, normal, null]
        content:
          type: string
          description: 🔴 **학부모가 쓴 원문**이다. 답을 쓰려면 봐야 한다.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time, nullable: true }
        answerable: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/TeacherConsultationMessage' }

    AnswerRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 🔴 상한은 V44 `ck_member_consultation_messages_content_length` 와 같다.

    ConsultationAnswerResult:
      type: object
      required: [consultationId, messageId, status, publishedAt]
      properties:
        consultationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        status:
          type: string
          enum: [ANSWERED]
          description: 🔴 발행 성공이면 항상 `ANSWERED` 다.
        publishedAt:
          type: string
          format: date-time
          description: 🔴 이 값이 있다는 것이 곧 학부모에게 보인다는 뜻이다.
